<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#050b18;
  --card:#0b1530;
  --card2:#101d3a;
  --border:#233761;
  --text:#ffffff;
  --muted:#8f9db9;
  --blue:#1677ff;
  --purple:#7428ff;
  --green:#18d987;
  --red:#ff4d67;
  --gold:#ffc94d;
}

body{
  margin:0;
  background:
    radial-gradient(circle at 20% 0%,rgba(79,44,255,.16),transparent 30%),
    radial-gradient(circle at 80% 0%,rgba(0,157,255,.10),transparent 25%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  width:min(1200px,100%);
  margin:auto;
  padding:20px;
}


/* HEADER */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  margin-bottom:22px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:95px;
  max-height:70px;
  object-fit:contain;
}

.titleBox h1{
  margin:0;
  font-size:30px;
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.dateBox{
  background:#101936;
  border:1px solid #29375e;
  padding:12px 18px;
  border-radius:20px;
  font-weight:700;
  white-space:nowrap;
}


/* DASHBOARD */

.dashboard{
  display:grid;
  grid-template-columns:1.45fr .9fr;
  gap:18px;
  margin-bottom:24px;
}

.statsBox{
  background:
    linear-gradient(135deg,rgba(36,60,180,.35),rgba(115,25,210,.28)),
    #0c1530;
  border:1px solid #383c9a;
  border-radius:24px;
  padding:22px;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}

.statsTitle{
  color:#b7c2de;
  font-size:14px;
}

.mainCount{
  display:flex;
  align-items:center;
  gap:15px;
  margin:12px 0 20px;
}

.mainIcon{
  width:64px;
  height:64px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#1748bc,#5c2df3);
  font-size:30px;
}

.mainCountNumber{
  font-size:56px;
  font-weight:900;
  line-height:1;
}

.statGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.statCard{
  border-radius:18px;
  padding:16px;
  background:#08172b;
  border:1px solid #193b61;
}

.statCard.green{
  background:#09271f;
  border-color:#176248;
}

.statLabel{
  font-size:13px;
  color:#9cacc8;
  margin-bottom:7px;
}

.statValue{
  font-size:24px;
  font-weight:900;
}

.greenText{
  color:#3ef29e;
}


/* BEST EMPLOYEE */

.bestCard{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,194,59,.16),transparent 35%),
    #10151f;
  border:1px solid #8f681b;
  border-radius:24px;
  padding:22px;
  text-align:center;
}

.bestCard:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,transparent,rgba(255,201,77,.05),transparent);
}

.trophy{
  width:54px;
  height:54px;
  margin:0 auto 10px;
  border-radius:50%;
  border:2px solid var(--gold);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  box-shadow:0 0 28px rgba(255,201,77,.35);
}

.bestTitle{
  color:var(--gold);
  font-size:17px;
  font-weight:900;
}

.avatar{
  width:92px;
  height:92px;
  margin:18px auto 12px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:44px;
  background:linear-gradient(145deg,#292b38,#111728);
  border:3px solid var(--gold);
  box-shadow:0 0 30px rgba(255,201,77,.25);
}

.bestName{
  font-size:23px;
  font-weight:900;
  margin-bottom:14px;
}

.bestStats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.bestStat{
  padding:10px;
  background:rgba(0,0,0,.22);
  border-radius:14px;
}

.bestStat span{
  display:block;
  font-size:11px;
  color:#aeb7c9;
}

.bestStat strong{
  display:block;
  font-size:20px;
  margin-top:5px;
}

.bestBonus{
  color:#35ef8b;
}


/* MAIN CONTENT */

.contentGrid{
  display:grid;
  grid-template-columns:1.6fr .72fr;
  gap:18px;
  align-items:start;
}

.sectionHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.sectionTitle{
  font-size:22px;
  font-weight:900;
}

.addEmployee{
  border:0;
  color:white;
  background:linear-gradient(90deg,#3e43ff,#7924e8);
  padding:13px 18px;
  border-radius:14px;
  font-size:15px;
  font-weight:800;
}


/* EMPLOYEE */

.employee{
  background:linear-gradient(145deg,#0a1428,#0c1830);
  border:1px solid #254371;
  border-radius:22px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.employeeTop{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
}

.employeeAvatar{
  flex:0 0 46px;
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(145deg,#4b38db,#b947df);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.name{
  flex:1;
  min-width:0;
  padding:12px;
  background:#0a1429;
  border:1px solid #263957;
  color:white;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
}

.delete{
  border:0;
  padding:12px 14px;
  border-radius:12px;
  background:#371727;
  color:#ff7186;
  font-weight:800;
}

.packages{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}

.package{
  background:#0d1830;
  border:1px solid #243754;
  border-radius:12px;
  overflow:hidden;
}

.packageHead{
  padding:9px 5px;
  text-align:center;
  font-size:13px;
  font-weight:900;
}

.p0{background:linear-gradient(135deg,#0062d9,#1690ff)}
.p1{background:linear-gradient(135deg,#008896,#15bab8)}
.p2{background:linear-gradient(135deg,#159343,#42c85e)}
.p3{background:linear-gradient(135deg,#ae5b11,#e4861d)}
.p4{background:linear-gradient(135deg,#bb1755,#f12c73)}
.p5{background:linear-gradient(135deg,#7022af,#a333d1)}

.packageBonus{
  text-align:center;
  padding:8px 3px 3px;
  font-size:10px;
  color:#9dacbf;
}

.count{
  display:block;
  width:calc(100% - 10px);
  margin:6px 5px 8px;
  border:0;
  outline:none;
  background:#17243d;
  color:white;
  text-align:center;
  border-radius:8px;
  font-size:18px;
  padding:8px 2px;
  font-weight:900;
}

.employeeResult{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.resultItem{
  background:#0d1830;
  border-radius:12px;
  padding:12px;
  border:1px solid #172a47;
}

.resultLabel{
  font-size:11px;
  color:#9aa7bc;
}

.resultValue{
  font-size:18px;
  font-weight:900;
  margin-top:5px;
}

.bonusValue{
  color:#35ef8b;
}


/* SIDE PANEL */

.sidePanel{
  background:#08162c;
  border:1px solid #1e365d;
  border-radius:22px;
  padding:15px;
  position:sticky;
  top:15px;
}

.sideTitle{
  font-size:19px;
  font-weight:900;
  margin-bottom:14px;
}

.monthItem{
  background:#101c38;
  border:1px solid #243c62;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.monthName{
  font-size:17px;
  font-weight:900;
  margin-bottom:10px;
}

.monthRow{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:6px 0;
  color:#aeb8ca;
  font-size:12px;
}

.monthRow strong{
  color:white;
}

.monthButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.monthExcel,
.monthDelete{
  border:0;
  border-radius:10px;
  padding:10px;
  font-weight:800;
  color:white;
}

.monthExcel{
  background:#0b7d44;
}

.monthDelete{
  background:#702431;
}

.empty{
  text-align:center;
  padding:18px;
  color:#7585a3;
}


/* BOTTOM BUTTONS */

.bottomActions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:16px;
}

.excelButton,
.saveMonth{
  border:0;
  padding:17px;
  border-radius:15px;
  color:white;
  font-size:16px;
  font-weight:900;
}

.excelButton{
  background:linear-gradient(90deg,#087b4d,#0b9d63);
}

.saveMonth{
  background:linear-gradient(90deg,#4d24d9,#792de9);
}


/* MOBILE */

@media(max-width:900px){

  .dashboard,
  .contentGrid{
    grid-template-columns:1fr;
  }

  .sidePanel{
    position:static;
  }

  .packages{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:600px){

  .container{
    padding:13px;
  }

  .topbar{
    align-items:flex-start;
  }

  .brand{
    gap:8px;
  }

  .logo{
    width:65px;
  }

  .titleBox h1{
    font-size:22px;
  }

  .dateBox{
    font-size:12px;
    padding:9px 10px;
  }

  .mainCountNumber{
    font-size:45px;
  }

  .packages{
    grid-template-columns:repeat(2,1fr);
  }

  .employeeResult{
    grid-template-columns:1fr;
  }

  .bottomActions{
    grid-template-columns:1fr;
  }

  .sectionHeader{
    align-items:stretch;
    flex-direction:column;
  }

}

</style>
</head>


<body>

<div class="container">

  <div class="topbar">

    <div class="brand">

      <img src="IMG_7968.png" class="logo" alt="Telecom">

      <div class="titleBox">
        <h1>Վաճառքի Հաշվիչ</h1>
        <div class="subtitle">
          Աշխատակիցների վաճառքներ և բոնուսներ
        </div>
      </div>

    </div>

    <div class="dateBox" id="todayDate">
      📅
    </div>

  </div>


  <div class="dashboard">

    <div class="statsBox">

      <div class="statsTitle">
        Ընդհանուր վաճառքների քանակ
      </div>

      <div class="mainCount">

        <div class="mainIcon">
          📈
        </div>

        <div class="mainCountNumber" id="allSalesCount">
          0
        </div>

      </div>


      <div class="statGrid">

        <div class="statCard">

          <div class="statLabel">
            💰 Ընդհանուր շրջանառություն
          </div>

          <div class="statValue" id="allRevenue">
            0 դրամ
          </div>

        </div>


        <div class="statCard green">

          <div class="statLabel">
            🎁 Ընդհանուր բոնուս
          </div>

          <div class="statValue greenText" id="allBonus">
            0 դրամ
          </div>

        </div>

      </div>

    </div>


    <div class="bestCard">

      <div class="trophy">
        🏆
      </div>

      <div class="bestTitle">
        ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ
      </div>

      <div class="avatar">
        👤
      </div>

      <div class="bestName" id="bestName">
        Դեռ չկա
      </div>

      <div class="bestStats">

        <div class="bestStat">
          <span>Վաճառքների քանակ</span>
          <strong id="bestSales">0</strong>
        </div>

        <div class="bestStat">
          <span>Ստացած բոնուս</span>
          <strong class="bestBonus" id="bestBonus">0 դրամ</strong>
        </div>

      </div>

    </div>

  </div>


  <div class="contentGrid">

    <main>

      <div class="sectionHeader">

        <div class="sectionTitle">
          Աշխատակիցներ
        </div>

        <button class="addEmployee" onclick="addEmployee()">
          + Ավելացնել աշխատակից
        </button>

      </div>

      <div id="employees"></div>


      <div class="bottomActions">

        <button class="excelButton" onclick="downloadCurrentExcel()">
          📊 Ներբեռնել Excel
        </button>

        <button class="saveMonth" onclick="saveCurrentMonth()">
          💾 Պահպանել այս ամսվա արդյունքը
        </button>

      </div>

    </main>


    <aside class="sidePanel">

      <div class="sideTitle">
        📅 Ամսվա հաշվետվություն
      </div>

      <div id="monthHistory"></div>

    </aside>

  </div>

</div>


<script>

const packages = [
  {price:3900, bonus:1000},
  {price:4900, bonus:1200},
  {price:5900, bonus:2000},
  {price:6900, bonus:1500},
  {price:7900, bonus:3000},
  {price:8900, bonus:2500}
];


let employeesData;

let monthHistory;

try{
  employeesData =
    JSON.parse(localStorage.getItem("employeesData")) || [];
}catch(e){
  employeesData = [];
}

try{
  monthHistory =
    JSON.parse(localStorage.getItem("monthHistory")) || [];
}catch(e){
  monthHistory = [];
}


let totals = {
  sales:0,
  revenue:0,
  bonus:0
};


function money(number){

  return new Intl.NumberFormat("hy-AM")
    .format(Number(number) || 0) + " դրամ";

}


function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function saveData(){

  localStorage.setItem(
    "employeesData",
    JSON.stringify(employeesData)
  );

}


function saveMonthHistory(){

  localStorage.setItem(
    "monthHistory",
    JSON.stringify(monthHistory)
  );

}


function normalizeEmployees(){

  employeesData.forEach(employee=>{

    if(!Array.isArray(employee.sales)){
      employee.sales = [0,0,0,0,0,0];
    }

    while(employee.sales.length < 6){
      employee.sales.push(0);
    }

    employee.sales =
      employee.sales
        .slice(0,6)
        .map(v => Math.max(0,Number(v) || 0));

    if(typeof employee.name !== "string"){
      employee.name = "";
    }

  });

}


function addEmployee(){

  employeesData.push({
    name:"",
    sales:[0,0,0,0,0,0]
  });

  saveData();
  renderEmployees();

}


function deleteEmployee(index){

  const employee =
    employeesData[index];

  if(!employee){
    return;
  }

  const name =
    employee.name.trim() ||
    "այս աշխատակցին";

  const ok = confirm(
    "Վստա՞հ եք, որ ցանկանում եք ջնջել " +
    name +
    "։"
  );

  if(!ok){
    return;
  }

  employeesData.splice(index,1);

  saveData();
  renderEmployees();

}


function updateName(index,value){

  if(!employeesData[index]){
    return;
  }

  employeesData[index].name = value;

  saveData();
  calculate();

}


function updateCount(employeeIndex,packageIndex,value){

  if(!employeesData[employeeIndex]){
    return;
  }

  let number =
    parseInt(value,10);

  if(isNaN(number) || number < 0){
    number = 0;
  }

  employeesData[employeeIndex]
    .sales[packageIndex] = number;

  saveData();
  calculate();

}


function renderEmployees(){

  normalizeEmployees();

  const container =
    document.getElementById("employees");

  container.innerHTML = "";


  employeesData.forEach(
    (employee,employeeIndex)=>{

      const box =
        document.createElement("div");

      box.className = "employee";


      let packageHTML = "";


      packages.forEach(
        (p,packageIndex)=>{

          packageHTML += `

            <div class="package">

              <div class="packageHead p${packageIndex}">
                ${p.price} դրամ
              </div>

              <div class="packageBonus">
                Բոնուս ${p.bonus}
              </div>

              <input
                class="count"
                type="number"
                min="0"
                step="1"
                inputmode="numeric"
                value="${employee.sales[packageIndex]}"
                oninput="updateCount(${employeeIndex},${packageIndex},this.value)"
              >

            </div>

          `;

      });


      box.innerHTML = `

        <div class="employeeTop">

          <div class="employeeAvatar">
            👤
          </div>

          <input
            class="name"
            type="text"
            placeholder="Աշխատակցի անուն"
            value="${escapeHtml(employee.name)}"
            oninput="updateName(${employeeIndex},this.value)"
          >

          <button
            class="delete"
            onclick="deleteEmployee(${employeeIndex})"
          >
            🗑 Ջնջել
          </button>

        </div>


        <div class="packages">
          ${packageHTML}
        </div>


        <div class="employeeResult">

          <div class="resultItem">
            <div class="resultLabel">
              🛒 Վաճառքների քանակ
            </div>

            <div
              class="resultValue"
              id="employeeSales${employeeIndex}"
            >
              0
            </div>
          </div>


          <div class="resultItem">
            <div class="resultLabel">
              💰 Շրջանառություն
            </div>

            <div
              class="resultValue"
              id="employeeRevenue${employeeIndex}"
            >
              0 դրամ
            </div>
          </div>


          <div class="resultItem">
            <div class="resultLabel">
              🎁 Ստացած բոնուս
            </div>

            <div
              class="resultValue bonusValue"
              id="employeeBonus${employeeIndex}"
            >
              0 դրամ
            </div>
          </div>

        </div>

      `;


      container.appendChild(box);

  });


  calculate();

}


function calculate(){

  let allSalesCount = 0;
  let allRevenue = 0;
  let allBonus = 0;

  let bestName = "Դեռ չկա";
  let bestSales = 0;
  let bestBonus = 0;


  employeesData.forEach(
    (employee,employeeIndex)=>{

      let employeeSales = 0;
      let employeeRevenue = 0;
      let employeeBonus = 0;


      employee.sales.forEach(
        (count,packageIndex)=>{

          count = Number(count) || 0;

          employeeSales += count;

          employeeRevenue +=
            count *
            packages[packageIndex].price;

          employeeBonus +=
            count *
            packages[packageIndex].bonus;

      });


      allSalesCount += employeeSales;
      allRevenue += employeeRevenue;
      allBonus += employeeBonus;


      const salesElement =
        document.getElementById(
          "employeeSales" +
          employeeIndex
        );

      const revenueElement =
        document.getElementById(
          "employeeRevenue" +
          employeeIndex
        );

      const bonusElement =
        document.getElementById(
          "employeeBonus" +
          employeeIndex
        );


      if(salesElement){
        salesElement.textContent =
          employeeSales;
      }

      if(revenueElement){
        revenueElement.textContent =
          money(employeeRevenue);
      }

      if(bonusElement){
        bonusElement.textContent =
          money(employeeBonus);
      }


      if(
        employeeSales > bestSales ||
        (
          employeeSales === bestSales &&
          employeeBonus > bestBonus
        )
      ){

        bestSales =
          employeeSales;

        bestBonus =
          employeeBonus;

        bestName =
          employee.name.trim() ||
          "Անանուն աշխատակից";

      }

  });


  totals.sales =
    allSalesCount;

  totals.revenue =
    allRevenue;

  totals.bonus =
    allBonus;


  document.getElementById(
    "allSalesCount"
  ).textContent =
    allSalesCount;


  document.getElementById(
    "allRevenue"
  ).textContent =
    money(allRevenue);


  document.getElementById(
    "allBonus"
  ).textContent =
    money(allBonus);


  if(bestSales === 0){

    document.getElementById(
      "bestName"
    ).textContent =
      "Դեռ չկա";

    document.getElementById(
      "bestSales"
    ).textContent =
      "0";

    document.getElementById(
      "bestBonus"
    ).textContent =
      "0 դրամ";

  }else{

    document.getElementById(
      "bestName"
    ).textContent =
      bestName;

    document.getElementById(
      "bestSales"
    ).textContent =
      bestSales;

    document.getElementById(
      "bestBonus"
    ).textContent =
      money(bestBonus);

  }

}


function getMonthName(){

  const months = [
    "Հունվար",
    "Փետրվար",
    "Մարտ",
    "Ապրիլ",
    "Մայիս",
    "Հունիս",
    "Հուլիս",
    "Օգոստոս",
    "Սեպտեմբեր",
    "Հոկտեմբեր",
    "Նոյեմբեր",
    "Դեկտեմբեր"
  ];

  const date =
    new Date();

  return (
    months[date.getMonth()] +
    " " +
    date.getFullYear()
  );

}

function saveCurrentMonth(){

  calculate();

  const monthName =
    getMonthName();


  const snapshot =
    JSON.parse(
      JSON.stringify(employeesData)
    );


  const data = {
    month:monthName,
    sales:totals.sales,
    revenue:totals.revenue,
    bonus:totals.bonus,
    employees:snapshot
  };


  const existingIndex =
    monthHistory.findIndex(
      item =>
        item.month === monthName
    );


  if(existingIndex >= 0){

    const ok =
      confirm(
        monthName +
        " ամսվա արդյունքն արդեն պահպանված է։ Թարմացնե՞լ։"
      );

    if(!ok){
      return;
    }

    monthHistory[existingIndex] =
      data;

  }else{

    monthHistory.unshift(data);

  }


  saveMonthHistory();

  renderMonthHistory();


  alert(
    monthName +
    " ամսվա արդյունքը պահպանված է։"
  );

}


function deleteMonth(index){

  const month =
    monthHistory[index];

  if(!month){
    return;
  }

  const ok =
    confirm(
      "Վստա՞հ եք, որ ցանկանում եք ջնջել " +
      month.month +
      " ամսվա հաշվետվությունը։"
    );

  if(!ok){
    return;
  }

  monthHistory.splice(index,1);

  saveMonthHistory();

  renderMonthHistory();

}


function renderMonthHistory(){

  const box =
    document.getElementById(
      "monthHistory"
    );

  box.innerHTML = "";


  if(monthHistory.length === 0){

    box.innerHTML = `
      <div class="empty">
        Դեռ պահպանված ամիս չկա
      </div>
    `;

    return;

  }


  monthHistory.forEach(
    (item,index)=>{

      const div =
        document.createElement("div");

      div.className =
        "monthItem";


      div.innerHTML = `

        <div class="monthName">
          📅 ${escapeHtml(item.month)}
        </div>


        <div class="monthRow">
          <span>Վաճառքներ</span>
          <strong>
            ${Number(item.sales) || 0}
          </strong>
        </div>


        <div class="monthRow">
          <span>Շրջանառություն</span>
          <strong>
            ${money(item.revenue)}
          </strong>
        </div>


        <div class="monthRow">
          <span>Բոնուսներ</span>
          <strong>
            ${money(item.bonus)}
          </strong>
        </div>


        <div class="monthButtons">

          <button
            class="monthExcel"
            onclick="downloadMonthExcel(${index})"
          >
            📊 Excel
          </button>


          <button
            class="monthDelete"
            onclick="deleteMonth(${index})"
          >
            🗑 Ջնջել
          </button>

        </div>

      `;


      box.appendChild(div);

  });

}


/* EXCEL */

function downloadExcel(
  employees,
  title,
  filename
){

  if(typeof XLSX === "undefined"){

    alert(
      "Excel համակարգը չի բեռնվել։ Ստուգեք ինտերնետ կապը։"
    );

    return;

  }


  let bestEmployeeName =
    "Դեռ չկա";

  let bestEmployeeSales =
    0;

  let bestEmployeeBonus =
    0;

  let totalSales =
    0;

  let totalRevenue =
    0;

  let totalBonus =
    0;


  const employeeRows = [];


  employees.forEach(employee=>{

    const sales =
      Array.isArray(employee.sales)
        ? employee.sales
        : [0,0,0,0,0,0];


    let employeeSales =
      0;

    let employeeRevenue =
      0;

    let employeeBonus =
      0;


    for(let i=0;i<6;i++){

      const count =
        Number(sales[i]) || 0;

      employeeSales +=
        count;

      employeeRevenue +=
        count *
        packages[i].price;

      employeeBonus +=
        count *
        packages[i].bonus;

    }


    totalSales +=
      employeeSales;

    totalRevenue +=
      employeeRevenue;

    totalBonus +=
      employeeBonus;


    if(
      employeeSales > bestEmployeeSales ||
      (
        employeeSales === bestEmployeeSales &&
        employeeBonus > bestEmployeeBonus
      )
    ){

      bestEmployeeSales =
        employeeSales;

      bestEmployeeBonus =
        employeeBonus;

      bestEmployeeName =
        employee.name?.trim() ||
        "Անանուն աշխատակից";

    }


    employeeRows.push([
      employee.name?.trim() ||
      "Անանուն աշխատակից",

      Number(sales[0]) || 0,
      Number(sales[1]) || 0,
      Number(sales[2]) || 0,
      Number(sales[3]) || 0,
      Number(sales[4]) || 0,
      Number(sales[5]) || 0,

      employeeSales,
      employeeRevenue,
      employeeBonus
    ]);

  });


  const rows = [];


  rows.push([
    title
  ]);


  rows.push([]);


  rows.push([
    "🏆 ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ"
  ]);


  rows.push([
    "Անուն",
    bestEmployeeName
  ]);


  rows.push([
    "Վաճառքների քանակ",
    bestEmployeeSales
  ]);


  rows.push([
    "Ստացած բոնուս",
    bestEmployeeBonus
  ]);


  rows.push([]);


  rows.push([
    "Աշխատակից",
    "3900 փաթեթ",
    "4900 փաթեթ",
    "5900 փաթեթ",
    "6900 փաթեթ",
    "7900 փաթեթ",
    "8900 փաթեթ",
    "Ընդհանուր վաճառք",
    "Շրջանառություն",
    "Ստացած բոնուս"
  ]);


  employeeRows.forEach(row=>{
    rows.push(row);
  });


  rows.push([
    "ԸՆԴՀԱՆՈՒՐ",
    "",
    "",
    "",
    "",
    "",
    "",
    totalSales,
    totalRevenue,
    totalBonus
  ]);


  const worksheet =
    XLSX.utils.aoa_to_sheet(rows);


  worksheet["!cols"] = [
    {wch:25},
    {wch:15},
    {wch:15},
    {wch:15},
    {wch:15},
    {wch:15},
    {wch:15},
    {wch:20},
    {wch:20},
    {wch:20}
  ];


  const workbook =
    XLSX.utils.book_new();


  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "Վաճառքներ"
  );


  XLSX.writeFile(
    workbook,
    filename + ".xlsx"
  );

}

function downloadMonthExcel(index){

  const month =
    monthHistory[index];

  if(!month){
    return;
  }


  if(
    !Array.isArray(month.employees) ||
    month.employees.length === 0
  ){

    alert(
      "Այս ամսվա աշխատակիցների մանրամասն տվյալները պահպանված չեն։"
    );

    return;

  }


  downloadExcel(
    month.employees,
    month.month +
    " — հաշվետվություն",
    "Վաճառքներ_" +
    month.month
  );

}
