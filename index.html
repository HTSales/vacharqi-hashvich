<script>
function downloadExcel(employees,title,filename){

  if(typeof XLSX === "undefined"){
    alert("Excel համակարգը չի բեռնվել։");
    return;
  }

  const rows = [];

  let totalSales = 0;
  let totalRevenue = 0;
  let totalBonus = 0;

  let bestEmployeeName = "";
  let bestEmployeeSales = -1;
  let bestEmployeeBonus = 0;

  const employeeRows = [];

  employees.forEach(employee=>{

    const sales =
      employee.sales || [0,0,0,0,0,0];

    let employeeSales = 0;
    let employeeRevenue = 0;
    let employeeBonus = 0;

    sales.forEach((count,index)=>{

      count = Number(count) || 0;

      employeeSales += count;
      employeeRevenue += count * packages[index].price;
      employeeBonus += count * packages[index].bonus;
    });

    totalSales += employeeSales;
    totalRevenue += employeeRevenue;
    totalBonus += employeeBonus;

    if(employeeSales > bestEmployeeSales){

      bestEmployeeSales = employeeSales;
      bestEmployeeBonus = employeeBonus;
      bestEmployeeName =
        employee.name || "Անանուն աշխատակից";
    }

    employeeRows.push([
      employee.name || "Անանուն աշխատակից",
      sales[0] || 0,
      sales[1] || 0,
      sales[2] || 0,
      sales[3] || 0,
      sales[4] || 0,
      sales[5] || 0,
      employeeSales,
      employeeRevenue,
      employeeBonus
    ]);

  });

  rows.push([
    title
  ]);

  rows.push([]);

  rows.push([
    "🏆 ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ"
  ]);

  rows.push([
    "Անուն",
    bestEmployeeName
  ]);

  rows.push([
    "Վաճառքների քանակ",
    bestEmployeeSales < 0 ? 0 : bestEmployeeSales
  ]);

  rows.push([
    "Ստացած բոնուս",
    bestEmployeeBonus
  ]);

  rows.push([]);

  rows.push([
    "Աշխատակից",
    "3900 փաթեթ",
    "4900 փաթեթ",
    "5900 փաթեթ",
    "6900 փաթեթ",
    "7900 փաթեթ",
    "8900 փաթեթ",
    "Ընդհանուր վաճառք",
    "Շրջանառություն",
    "Ստացած բոնուս"
  ]);

  employeeRows.forEach(row=>{
    rows.push(row);
  });

  rows.push([
    "ԸՆԴՀԱՆՈՒՐ",
    "",
    "",
    "",
    "",
    "",
    "",
    totalSales,
    totalRevenue,
    totalBonus
  ]);

  const worksheet =
    XLSX.utils.aoa_to_sheet(rows);

  worksheet["!cols"] = [
    {wch:24},
    {wch:18},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:18},
    {wch:20},
    {wch:20}
  ];

  const workbook =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,
    worksheet,
    "Վաճառքներ"
  );

  XLSX.writeFile(
    workbook,
    filename + ".xlsx"
  );
}
</script>
