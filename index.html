<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  background: #0b1020;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

.subtitle {
  color: #9aa8c8;
  margin-bottom: 20px;
}

.card {
  background: #121a2f;
  border-radius: 24px;
  padding: 16px;
}

.person {
  background: #0e1528;
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 12px;
}

.personTop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.personTitle {
  font-weight: 700;
  font-size: 17px;
}

.removeBtn {
  border: none;
  background: #3a1d26;
  color: #ff8c9b;
  padding: 8px 12px;
  border-radius: 10px;
  font-weight: 700;
}

label {
  display: block;
  font-size: 13px;
  color: #9aa8c8;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 14px;
  margin-bottom: 10px;
  border-radius: 13px;
  border: 1px solid #29334d;
  background: #171f36;
  color: white;
  font-size: 16px;
}

.bonusBox {
  background: #171f36;
  border-radius: 13px;
  padding: 12px;
}

.bonusLabel {
  color: #9aa8c8;
  font-size: 12px;
}

.bonusValue {
  margin-top: 4px;
  font-size: 20px;
  font-weight: 800;
}

.addBtn {
  width: 100%;
  border: none;
  background: #526cff;
  color: white;
  padding: 15px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 800;
  margin-top: 4px;
}

.summary {
  margin-top: 18px;
}

.result {
  background: #0e1528;
  border-radius: 16px;
  padding: 15px;
  margin-top: 10px;
}

.resultTitle {
  color: #9aa8c8;
  font-size: 13px;
}

.resultValue {
  margin-top: 4px;
  font-size: 24px;
  font-weight: 800;
}

.final {
  background: #12352f;
}

.final .resultValue {
  color: #66efbd;
  font-size: 29px;
}
</style>
</head>

<body>

<div class="container">

  <h1>Վաճառքի Հաշվիչ</h1>

  <div class="subtitle">
    Ամեն բաժանորդի համար ընտրիր իր փաթեթը
  </div>

  <div class="card">

    <div id="people"></div>

    <button class="addBtn" onclick="addPerson()">
      + Ավելացնել բաժանորդ
    </button>

    <div class="summary">

      <div class="result">
        <div class="resultTitle">Ընդհանուր բաժանորդներ</div>
        <div class="resultValue" id="totalPeople">0</div>
      </div>

      <div class="result">
        <div class="resultTitle">Ընդհանուր վաճառք</div>
        <div class="resultValue" id="totalSales">0 դրամ</div>
      </div>

      <div class="result">
        <div class="resultTitle">Ընդհանուր բոնուս</div>
        <div class="resultValue" id="totalBonus">0 դրամ</div>
      </div>

      <div class="result final">
        <div class="resultTitle">Քեզ մնացող գումար</div>
        <div class="resultValue" id="profit">0 դրամ</div>
      </div>

    </div>

  </div>

</div>

<script>

const packages = {
  3900: 1000,
  4900: 1200,
  5900: 2000,
  6900: 1500,
  7900: 3000,
  8900: 2500
};

let personCount = 0;

function money(value) {
  return new Intl.NumberFormat("hy-AM").format(value) + " դրամ";
}

function addPerson() {

  personCount++;

  const div = document.createElement("div");
  div.className = "person";

  div.innerHTML = `
    <div class="personTop">
      <div class="personTitle">
        Բաժանորդ ${personCount}
      </div>

      <button class="removeBtn" onclick="removePerson(this)">
        Ջնջել
      </button>
    </div>

    <label>Անուն / նշում</label>

    <input
      type="text"
      placeholder="Օրինակ՝ Արամ"
    >

    <label>Փաթեթ</label>

    <select onchange="updatePerson(this)">
      <option value="">Ընտրիր փաթեթը</option>
      <option value="3900">3,900 դրամ</option>
      <option value="4900">4,900 դրամ</option>
      <option value="5900">5,900 դրամ</option>
      <option value="6900">6,900 դրամ</option>
      <option value="7900">7,900 դրամ</option>
      <option value="8900">8,900 դրամ</option>
    </select>

    <div class="bonusBox">
      <div class="bonusLabel">
        Այս բաժանորդի բոնուսը
      </div>

      <div class="bonusValue">
        0 դրամ
      </div>
    </div>
  `;

  document.getElementById("people").appendChild(div);

  calculateTotals();
}

function updatePerson(select) {

  const person = select.closest(".person");

  const price = Number(select.value) || 0;

  const bonus = packages[price] || 0;

  person.querySelector(".bonusValue").textContent =
    money(bonus);

  calculateTotals();
}

function removePerson(button) {

  button.closest(".person").remove();

  calculateTotals();
}

function calculateTotals() {

  const people = document.querySelectorAll(".person");

  let totalPeople = 0;
  let totalSales = 0;
  let totalBonus = 0;

  people.forEach(function(person) {

    const select = person.querySelector("select");

    const price = Number(select.value) || 0;

    if (price > 0) {

      totalPeople++;

      totalSales += price;

      totalBonus += packages[price] || 0;
    }
  });

  const profit = totalSales - totalBonus;

  document.getElementById("totalPeople").textContent =
    totalPeople;

  document.getElementById("totalSales").textContent =
    money(totalSales);

  document.getElementById("totalBonus").textContent =
    money(totalBonus);

  document.getElementById("profit").textContent =
    money(profit);
}

addPerson();

</script>

</body>
</html>
