<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:5px auto 15px;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

h1{
  margin:5px 0;
  font-size:28px;
}

.subtitle{
  color:#9aa8c8;
  font-size:14px;
}

.status{
  text-align:center;
  font-size:12px;
  margin-bottom:15px;
  color:#62e9b8;
}

.totalBox{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
}

.totalTitle{
  font-size:14px;
  opacity:.8;
}

.bigNumber{
  font-size:32px;
  font-weight:900;
  margin:5px 0 15px;
}

.totalGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.totalItem{
  background:rgba(0,0,0,.18);
  padding:12px;
  border-radius:13px;
}

.small{
  font-size:12px;
  opacity:.7;
}

.value{
  font-size:18px;
  font-weight:900;
  margin-top:4px;
}

/* BEST EMPLOYEE */

.bestBox{
  background:linear-gradient(135deg,#34280d,#171f2e);
  border:1px solid #8f6a17;
  border-radius:18px;
  padding:14px;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.bestIcon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#4a3810;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}

.bestLabel{
  color:#ffd25a;
  font-size:11px;
  font-weight:900;
}

.bestName{
  font-size:19px;
  font-weight:900;
  margin-top:3px;
}

.bestInfo{
  color:#b5ad9b;
  font-size:12px;
  margin-top:4px;
}

/* BONUS SETTINGS */

.sectionTitle{
  font-size:19px;
  font-weight:900;
  margin:20px 0 10px;
}

.bonusSettings{
  background:#111c30;
  border-radius:20px;
  padding:15px;
  margin-bottom:18px;
}

.bonusRow{
  background:#0c1526;
  border-radius:13px;
  padding:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.packagePrice{
  font-size:17px;
  font-weight:900;
}

.packageBonus{
  color:#8292ad;
  font-size:12px;
  margin-top:3px;
}

.editBtn{
  border:0;
  background:#263a56;
  color:white;
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
}

/* EMPLOYEES */

.employee{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-bottom:16px;
}

.employeeTop{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.name{
  flex:1;
  padding:14px;
  border-radius:13px;
  border:1px solid #2a3a55;
  background:#0c1526;
  color:white;
  font-size:17px;
  font-weight:800;
}

.delete{
  border:0;
  background:#3a1d26;
  color:#ff9ba8;
  border-radius:12px;
  padding:12px;
  font-weight:800;
}

.package{
  display:grid;
  grid-template-columns:1fr 85px;
  gap:10px;
  align-items:center;
  background:#0c1526;
  border-radius:14px;
  padding:11px;
  margin-bottom:8px;
}

.count{
  width:100%;
  padding:11px;
  border-radius:11px;
  border:1px solid #34435d;
  background:#172238;
  color:white;
  text-align:center;
  font-size:18px;
  font-weight:900;
}

.employeeResult{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.resultItem{
  background:#172238;
  border-radius:13px;
  padding:12px;
}

.bonusResult{
  background:#12372f;
}

.bonusResult .value{
  color:#62e9b8;
}

/* BUTTONS */

.button{
  width:100%;
  border:0;
  border-radius:15px;
  padding:16px;
  margin-bottom:12px;
  color:white;
  font-size:16px;
  font-weight:900;
}

.add{background:#25a8df}
.excel{background:#16794d}
.saveMonth{background:#1fa76f}
.backup{background:#805ad5}
.restore{background:#b7791f}

/* MONTH */

.monthBox{
  background:#111c30;
  border-radius:22px;
  padding:18px;
  margin-top:15px;
  margin-bottom:30px;
}

.monthItem{
  background:#0c1526;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
}

.monthName{
  font-size:18px;
  font-weight:900;
  margin-bottom:8px;
}

.monthRow{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  font-size:14px;
}

.monthButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.monthButtons button{
  border:0;
  border-radius:10px;
  padding:11px;
  color:white;
  font-weight:800;
}

.monthExcel{background:#16794d}
.monthDelete{background:#3a1d26;color:#ff9ba8!important}

.empty{
  color:#8795b3;
  text-align:center;
  padding:15px;
}

#backupFile{display:none}
</style>
</head>

<body>

<div class="container">

<img src="IMG_7968.png" class="logo">

<div class="header">
  <h1>Վաճառքի Հաշվիչ</h1>
  <div class="subtitle">Աշխատակիցների վաճառքներ և բոնուսներ</div>
</div>

<div id="status" class="status">
  Միանում է տվյալների բազային...
</div>

<div class="totalBox">

  <div class="totalTitle">Ընդհանուր վաճառքների քանակ</div>

  <div class="bigNumber" id="allSales">0</div>

  <div class="totalGrid">

    <div class="totalItem">
      <div class="small">Ընդհանուր շրջանառություն</div>
      <div class="value" id="allRevenue">0 դրամ</div>
    </div>

    <div class="totalItem">
      <div class="small">Ընդհանուր բոնուս</div>
      <div class="value" id="allBonus">0 դրամ</div>
    </div>

  </div>
</div>

<div class="bestBox">

  <div class="bestIcon">🏆</div>

  <div>
    <div class="bestLabel">ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ</div>
    <div class="bestName" id="bestName">Դեռ չկա</div>
    <div class="bestInfo" id="bestInfo">0 վաճառք • 0 դրամ բոնուս</div>
  </div>

</div>

<div class="sectionTitle">Բոնուսների կարգավորում</div>

<div id="bonusSettings" class="bonusSettings"></div>

<div id="employees"></div>

<button class="button add" onclick="addEmployee()">
  + Ավելացնել աշխատակից
</button>

<button class="button excel" onclick="downloadExcel()">
  📥 Ներբեռնել Excel
</button>

<button class="button backup" onclick="downloadBackup()">
  💾 Backup պահել
</button>

<button class="button restore" onclick="chooseBackup()">
  📂 Backup վերականգնել
</button>

<input type="file" id="backupFile" accept=".json" onchange="restoreBackup(event)">

<div class="monthBox">

  <h2>Ամսվա հաշվետվություն</h2>

  <button class="button saveMonth" onclick="saveMonth()">
    Պահպանել այս ամսվա արդյունքը
  </button>

  <div id="months"></div>

</div>

</div>

<script>

const PASSWORD = "1234";

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let packages = [];
let employees = [];

let monthHistory = JSON.parse(
  localStorage.getItem("monthHistory") || "[]"
);

const packageFields = [
  "package_3900",
  "package_4900",
  "package_5900",
  "package_6900",
  "package_7900",
  "package_8900"
];

function money(n){
  return new Intl.NumberFormat("hy-AM").format(Number(n)||0)+" դրամ";
}

function password(){

  const p = prompt("Գրեք գաղտնաբառը");

  if(p === null) return false;

  if(p !== PASSWORD){
    alert("Սխալ գաղտնաբառ");
    return false;
  }

  return true;
}

function status(text,error=false){

  const el=document.getElementById("status");

  el.textContent=text;
  el.style.color=error ? "#ff8b9b" : "#62e9b8";
}

function escapeHtml(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

/* LOAD DATA */

async function loadData(){

  status("Բեռնում է տվյալները...");

  try{

    const p = await db
      .from("packages")
      .select("*")
      .order("price");

    if(p.error) throw p.error;

    packages = p.data || [];

    const e = await db
      .from("employees")
      .select("*")
      .order("id");

    if(e.error) throw e.error;

    employees = e.data || [];

    renderBonuses();
    renderEmployees();
    renderMonths();

    status("● Տվյալները համաժամացված են");

  }catch(err){

    console.error(err);

    status("Չհաջողվեց միանալ բազային",true);
  }
}

/* BONUS */

function renderBonuses(){

  const box=document.getElementById("bonusSettings");
  box.innerHTML="";

  packages.forEach((p,i)=>{

    const div=document.createElement("div");
    div.className="bonusRow";

    div.innerHTML=`
      <div>
        <div class="packagePrice">${money(p.price)}</div>
        <div class="packageBonus">1 վաճառքից՝ ${money(p.bonus)}</div>
      </div>

      <button class="editBtn" onclick="changeBonus(${i})">
        Փոխել
      </button>
    `;

    box.appendChild(div);
  });
}

async function changeBonus(i){

  if(!password()) return;

  const value=prompt(
    "Նոր բոնուսը",
    packages[i].bonus
  );

  if(value===null) return;

  const n=Number(value);

  if(!Number.isFinite(n)||n<0){
    alert("Գրեք ճիշտ թիվ");
    return;
  }

  status("Պահպանում է...");

  const {error}=await db
    .from("packages")
    .update({
      bonus:Math.round(n),
      updated_at:new Date().toISOString()
    })
    .eq("id",packages[i].id);

  if(error){
    console.error(error);
    status("Բոնուսը չպահպանվեց",true);
    alert("Բոնուսը չպահպանվեց");
    return;
  }

  packages[i].bonus=Math.round(n);

  renderBonuses();
  renderEmployees();

  status("● Բոնուսը պահպանված է");
}

/* EMPLOYEES */

async function addEmployee(){

  if(!password()) return;

  const name=prompt("Գրեք աշխատակցի անունը");

  if(name===null || !name.trim()) return;

  status("Ավելացնում է աշխատակցին...");

  const {data,error}=await db
    .from("employees")
    .insert({
      name:name.trim(),
      package_3900:0,
      package_4900:0,
      package_5900:0,
      package_6900:0,
      package_7900:0,
      package_8900:0,
      updated_at:new Date().toISOString()
    })
    .select()
    .single();

  if(error){

    console.error(error);

    alert("Չհաջողվեց ավելացնել։ Հնարավոր է նույն անունն արդեն կա։");

    status("Սխալ",true);
    return;
  }

  employees.push(data);

  renderEmployees();

  status("● Աշխատակիցը ավելացված է");
}

async function changeName(i){

  if(!password()) return;

  const employee=employees[i];

  const name=prompt(
    "Աշխատակցի անունը",
    employee.name
  );

  if(name===null || !name.trim()) return;

  const {error}=await db
    .from("employees")
    .update({
      name:name.trim(),
      updated_at:new Date().toISOString()
    })
    .eq("id",employee.id);

  if(error){
    alert("Անունը չպահպանվեց");
    return;
  }

  employee.name=name.trim();

  renderEmployees();

  status("● Անունը պահպանված է");
}

async function changeCount(employeeIndex,packageIndex){

  if(!password()) return;

  const employee=employees[employeeIndex];

  const field=packageFields[packageIndex];

  const current=Number(employee[field])||0;

  const value=prompt(
    money(packages[packageIndex].price)+" փաթեթի վաճառքների քանակը",
    current
  );

  if(value===null) return;

  const n=Number(value);

  if(!Number.isInteger(n)||n<0){
    alert("Գրեք ճիշտ ամբողջ թիվ");
    return;
  }

  status("Պահպանում է...");

  const update={};
  update[field]=n;
  update.updated_at=new Date().toISOString();

  const {error}=await db
    .from("employees")
    .update(update)
    .eq("id",employee.id);

  if(error){

    console.error(error);

    alert("Վաճառքը չպահպանվեց");

    status("Պահպանման սխալ",true);
    return;
  }

  employee[field]=n;

  renderEmployees();

  status("● Վաճառքը պահպանված է");
}

async function deleteEmployee(i){

  if(!password()) return;

  const employee=employees[i];

  if(!confirm(
    "Վստա՞հ եք, որ ցանկանում եք ջնջել "+employee.name+"։"
  )) return;

  const {error}=await db
    .from("employees")
    .delete()
    .eq("id",employee.id);

  if(error){

    alert("Չհաջողվեց ջնջել");
    return;
  }

  employees.splice(i,1);

  renderEmployees();

  status("● Աշխատակիցը ջնջված է");
}

function renderEmployees(){

  const box=document.getElementById("employees");

  box.innerHTML="";

  if(employees.length===0){

    box.innerHTML=`
      <div class="empty">
        Դեռ աշխատակից չկա
      </div>
    `;

    calculate();
    return;
  }

  employees.forEach((employee,ei)=>{

    let packageHTML="";

    packages.forEach((p,pi)=>{

      const count=Number(employee[packageFields[pi]])||0;

      packageHTML+=`
        <div class="package">

          <div>
            <div class="packagePrice">${money(p.price)}</div>
            <div class="packageBonus">
              Բոնուս՝ ${money(p.bonus)}
            </div>
          </div>

          <input
            class="count"
            value="${count}"
            readonly
            onclick="changeCount(${ei},${pi})"
          >

        </div>
      `;
    });

    const div=document.createElement("div");

    div.className="employee";

    div.innerHTML=`
      <div class="employeeTop">

        <input
          class="name"
          value="${escapeHtml(employee.name)}"
          readonly
          onclick="changeName(${ei})"
        >

        <button class="delete" onclick="deleteEmployee(${ei})">
          Ջնջել
        </button>

      </div>

      ${packageHTML}

      <div class="employeeResult">

        <div class="resultItem">
          <div class="small">Վաճառքների քանակ</div>
          <div class="value" id="sales${ei}">0</div>
        </div>

        <div class="resultItem bonusResult">
          <div class="small">Ստացած բոնուս</div>
          <div class="value" id="bonus${ei}">0 դրամ</div>
        </div>

      </div>
    `;

    box.appendChild(div);
  });

  calculate();
}

/* CALCULATE */

function calculate(){

  let allSales=0;
  let allRevenue=0;
  let allBonus=0;

  let best=null;

  employees.forEach((employee,ei)=>{

    let sales=0;
    let bonus=0;

    packages.forEach((p,pi)=>{

      const count=Number(employee[packageFields[pi]])||0;

      sales+=count;
      bonus+=count*Number(p.bonus);

      allSales+=count;
      allRevenue+=count*Number(p.price);
      allBonus+=count*Number(p.bonus);
    });

    const salesEl=document.getElementById("sales"+ei);
    const bonusEl=document.getElementById("bonus"+ei);

    if(salesEl) salesEl.textContent=sales;
    if(bonusEl) bonusEl.textContent=money(bonus);

    if(
      !best ||
      sales>best.sales ||
      (sales===best.sales && bonus>best.bonus)
    ){
      best={
        name:employee.name,
        sales:sales,
        bonus:bonus
      };
    }
  });

  document.getElementById("allSales").textContent=allSales;
  document.getElementById("allRevenue").textContent=money(allRevenue);
  document.getElementById("allBonus").textContent=money(allBonus);

  if(best && best.sales>0){

    document.getElementById("bestName").textContent=
      best.name || "Անանուն աշխատակից";

    document.getElementById("bestInfo").textContent=
      best.sales+" վաճառք • "+money(best.bonus);

  }else{

    document.getElementById("bestName").textContent="Դեռ չկա";

    document.getElementById("bestInfo").textContent=
      "0 վաճառք • 0 դրամ բոնուս";
  }

  return{
    sales:allSales,
    revenue:allRevenue,
    bonus:allBonus
  };
}

/* MONTH */

function monthName(){

  const months=[
    "Հունվար","Փետրվար","Մարտ","Ապրիլ",
    "Մայիս","Հունիս","Հուլիս","Օգոստոս",
    "Սեպտեմբեր","Հոկտեմբեր","Նոյեմբեր","Դեկտեմբեր"
  ];

  const d=new Date();

  return months[d.getMonth()]+" "+d.getFullYear();
}

function saveMonth(){

  if(!password()) return;

  const totals=calculate();

  const name=monthName();

  const snapshot={
    month:name,
    sales:totals.sales,
    revenue:totals.revenue,
    bonus:totals.bonus,
    employees:JSON.parse(JSON.stringify(employees)),
    packages:JSON.parse(JSON.stringify(packages))
  };

  const index=monthHistory.findIndex(x=>x.month===name);

  if(index>=0){

    if(!confirm(name+" արդեն պահպանված է։ Թարմացնե՞լ։")){
      return;
    }

    monthHistory[index]=snapshot;

  }else{

    monthHistory.unshift(snapshot);
  }

  localStorage.setItem(
    "monthHistory",
    JSON.stringify(monthHistory)
  );

  renderMonths();

  alert("Ամսվա արդյունքը պահպանված է");
}

function renderMonths(){

  const box=document.getElementById("months");

  box.innerHTML="";

  if(monthHistory.length===0){

    box.innerHTML=`
      <div class="empty">
        Դեռ պահպանված ամիս չկա
      </div>
    `;

    return;
  }

  monthHistory.forEach((m,i)=>{

    const div=document.createElement("div");

    div.className="monthItem";

    div.innerHTML=`
      <div class="monthName">${escapeHtml(m.month)}</div>

      <div class="monthRow">
        <span>Վաճառքներ</span>
        <strong>${m.sales}</strong>
      </div>

      <div class="monthRow">
        <span>Շրջանառություն</span>
        <strong>${money(m.revenue)}</strong>
      </div>

      <div class="monthRow">
        <span>Բոնուսներ</span>
        <strong>${money(m.bonus)}</strong>
      </div>

      <div class="monthButtons">

        <button class="monthExcel" onclick="downloadMonthExcel(${i})">
          Excel
        </button>

        <button class="monthDelete" onclick="deleteMonth(${i})">
          Ջնջել
        </button>

      </div>
    `;

    box.appendChild(div);
  });
}

function deleteMonth(i){

  if(!password()) return;

  if(!confirm("Ջնջե՞լ այս ամսվա հաշվետվությունը։")){
    return;
  }

  monthHistory.splice(i,1);

  localStorage.setItem(
    "monthHistory",
    JSON.stringify(monthHistory)
  );

  renderMonths();
}

/* EXCEL */

function createExcel(empData,packData,title,fileName){

  const rows=[];

  let bestName="Դեռ չկա";
  let bestSales=0;
  let bestBonus=0;

  const dataRows=[];

  empData.forEach(emp=>{

    let sales=0;
    let revenue=0;
    let bonus=0;

    const counts=[];

    packData.forEach((p,i)=>{

      const c=Number(emp[packageFields[i]])||0;

      counts.push(c);

      sales+=c;
      revenue+=c*Number(p.price);
      bonus+=c*Number(p.bonus);
    });

    if(
      sales>bestSales ||
      (sales===bestSales && bonus>bestBonus)
    ){
      bestName=emp.name || "Անանուն";
      bestSales=sales;
      bestBonus=bonus;
    }

    dataRows.push([
      emp.name,
      ...counts,
      sales,
      revenue,
      bonus
    ]);
  });

  rows.push([title]);
  rows.push([]);
  rows.push(["🏆 ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ"]);
  rows.push(["Անուն",bestName]);
  rows.push(["Վաճառքներ",bestSales]);
  rows.push(["Բոնուս",bestBonus]);
  rows.push([]);

  rows.push([
    "Աշխատակից",
    "3900",
    "4900",
    "5900",
    "6900",
    "7900",
    "8900",
    "Ընդհանուր վաճառք",
    "Շրջանառություն",
    "Բոնուս"
  ]);

  dataRows.forEach(r=>rows.push(r));

  const ws=XLSX.utils.aoa_to_sheet(rows);

  ws["!cols"]=[
    {wch:24},{wch:12},{wch:12},{wch:12},
    {wch:12},{wch:12},{wch:12},
    {wch:18},{wch:20},{wch:18}
  ];

  const wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Վաճառքներ"
  );

  XLSX.writeFile(
    wb,
    fileName+".xlsx"
  );
}

function downloadExcel(){

  createExcel(
    employees,
    packages,
    monthName()+" — ընթացիկ արդյունք",
    "Վաճառքներ_"+monthName()
  );
}

function downloadMonthExcel(i){

  const m=monthHistory[i];

  createExcel(
    m.employees,
    m.packages,
    m.month+" — հաշվետվություն",
    "Վաճառքներ_"+m.month
  );
}

/* BACKUP */

function downloadBackup(){

  const data={
    version:2,
    createdAt:new Date().toISOString(),
    employees:employees,
    packages:packages,
    months:monthHistory
  };

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;
  a.download=
    "vacharqi-backup-"+new Date().toISOString().slice(0,10)+".json";

  a.click();

  URL.revokeObjectURL(url);
}

function chooseBackup(){

  if(!password()) return;

  document.getElementById("backupFile").click();
}

async function restoreBackup(event){

  const file=event.target.files[0];

  if(!file) return;

  try{

    const text=await file.text();
    const data=JSON.parse(text);

    if(
      !Array.isArray(data.employees) ||
      !Array.isArray(data.packages)
    ){
      throw new Error();
    }

    if(!confirm(
      "Backup-ի տվյալները կփոխարինեն ներկայիս տվյալներին։ Շարունակե՞լ։"
    )){
      event.target.value="";
      return;
    }

    for(const p of data.packages){

      await db
        .from("packages")
        .update({
          bonus:p.bonus,
          updated_at:new Date().toISOString()
        })
        .eq("price",p.price);
    }

    if(Array.isArray(data.months)){

      monthHistory=data.months;

      localStorage.setItem(
        "monthHistory",
        JSON.stringify(monthHistory)
      );
    }

    await loadData();

    alert("Backup-ը վերականգնվեց");

  }catch(err){

    console.error(err);

    alert("Backup ֆայլը ճիշտ չէ");
  }

  event.target.value="";
}

/* START */

loadData();
