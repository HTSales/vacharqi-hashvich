<style>

html,body{

<body>

<div class="container">

</div>

<div class="dateBox">

  <div class="clock" id="clock"></div>

<div class="summaryGrid">

  <div class="summaryCard">

</div>

<div class="myBonusCard">

  <div class="myBonusLabel">

    📥 Այսօրվա Excel

<div id="history"></div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const PASSWORD = "1234";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {

  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",

  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",

  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"

};

const packageOrder = [

  "home_standard",
  "home_premium",
  "home_ultima",

  "inet1",
  "inet2",
  "inet3",

  "iptv1",
  "iptv2",
  "iptv3"

];

let employees = [];
let packages = [];
let allSales = [];
let todaySales = [];
let currentDay = "";

function money(value){

  return new Intl.NumberFormat(
    "hy-AM"
  ).format(
    Math.round(Number(value)||0)
  ) + " դրամ";

}

function localDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}

function askPassword(){

  return prompt(
    "Մուտքագրեք Admin գաղտնաբառը"
  ) === PASSWORD;

}

function updateClock(){

  const d = new Date();

  document.getElementById(
    "clock"
  ).textContent =
    d.toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById(
    "todayText"
  ).textContent =
    d.toLocaleDateString(
      "hy-AM",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}

function sortPackages(list){

  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );

}

function getTodayRow(employeeId){

  return todaySales.find(
    row =>
      Number(row.employee_id)
      ===
      Number(employeeId)
  );

}

function calculateRow(row){

  let sales = 0;
  let revenue = 0;
  let fullBonus = 0;
  let employeeBonus = 0;
  let adminBonus = 0;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field){
      return;
    }

    const count =
      Number(
        row ? row[field] : 0
      ) || 0;

    sales += count;

    revenue +=
      count *
      Number(pkg.price || 0);

    fullBonus +=
      count *
      Number(pkg.bonus || 0);

    employeeBonus +=
      count *
      Number(pkg.employee_bonus || 0);

    adminBonus +=
      count *
      Number(pkg.admin_bonus || 0);

  });

  return{
    sales,
    revenue,
    fullBonus,
    employeeBonus,
    adminBonus
  };

}

async function loadAll(){

  currentDay =
    localDateKey();

  document.getElementById(
    "status"
  ).textContent =
    "Տվյալները բեռնվում են...";

  try{

    const [
      employeesRes,
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("employees")
        .select("*")
        .eq("active",true)
        .order("name"),

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .order("sale_date",{ascending:false})

    ]);

    if(employeesRes.error)
      throw employeesRes.error;

    if(packagesRes.error)
      throw packagesRes.error;

    if(salesRes.error)
      throw salesRes.error;

    employees =
      employeesRes.data || [];

    packages =
      sortPackages(
        packagesRes.data || []
      );

    allSales =
      salesRes.data || [];

    todaySales =
      allSales.filter(
        row =>
          row.sale_date === currentDay
      );

    renderEmployees();
    renderSummary();
    renderHistory();

    document.getElementById(
      "status"
    ).textContent =
      "● Տվյալները թարմացված են";

  }
  catch(error){

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Տվյալները բեռնել չհաջողվեց";

  }

}

function renderSummary(){

  let todaySalesCount = 0;
  let todayFullBonus = 0;
  let todayEmployeeBonus = 0;
  let todayAdminBonus = 0;

  let allAdminBonus = 0;

  let best = null;

  todaySales.forEach(row=>{

    const t =
      calculateRow(row);

    todaySalesCount += t.sales;
    todayFullBonus += t.fullBonus;
    todayEmployeeBonus += t.employeeBonus;
    todayAdminBonus += t.adminBonus;

  });

  allSales.forEach(row=>{

    const t =
      calculateRow(row);

    allAdminBonus +=
      t.adminBonus;

  });

  employees.forEach(employee=>{

    const t =
      calculateRow(
        getTodayRow(employee.id)
      );

    if(
      !best ||
      t.sales > best.sales ||
      (
        t.sales === best.sales &&
        t.employeeBonus > best.bonus
      )
    ){

      best = {
        name:employee.name,
        sales:t.sales,
        bonus:t.employeeBonus
      };

    }

  });

  document.getElementById(
    "summarySales"
  ).textContent =
    todaySalesCount;

  document.getElementById(
    "summaryFullBonus"
  ).textContent =
    money(todayFullBonus);

  document.getElementById(
    "summaryEmployeeBonus"
  ).textContent =
    money(todayEmployeeBonus);

  document.getElementById(
    "myTotalBonus"
  ).textContent =
    money(allAdminBonus);

  document.getElementById(
    "todayMyBonus"
  ).textContent =
    "Այսօր +" +
    money(todayAdminBonus);

  if(best && best.sales > 0){

    document.getElementById(
      "bestName"
    ).textContent =
      best.name;

    document.getElementById(
      "bestInfo"
    ).textContent =
      best.sales +
      " վաճառք • " +
      money(best.bonus) +
      " աշխատակցի բոնուս";

  }
  else{

    document.getElementById(
      "bestName"
    ).textContent =
      "—";

    document.getElementById(
      "bestInfo"
    ).textContent =
      "Այսօր դեռ վաճառք չկա";

  }

}

function renderEmployees(){

  let html = "";

  employees.forEach(employee=>{

    const row =
      getTodayRow(employee.id);

    const totals =
      calculateRow(row);

    html += `

    <div class="employeeCard">

      <div class="employeeTop">

        <div>

          <div class="employeeName">
            ${escapeHtml(employee.name)}
          </div>

          <div class="employeeTotals">

            ${totals.sales} վաճառք

            <br>

            Աշխատակցին՝
            ${money(totals.employeeBonus)}

            • Ինձ՝
            ${money(totals.adminBonus)}

          </div>

        </div>

        <div class="employeeButtons">

          <button
            class="smallBtn"
            onclick="
              renameEmployee(
                ${employee.id},
                '${escapeJs(employee.name)}'
              )
            "
          >
            ✏️
          </button>

          <button
            class="smallBtn deleteBtn"
            onclick="
              deleteEmployee(
                ${employee.id},
                '${escapeJs(employee.name)}'
              )
            "
          >
            🗑
          </button>

        </div>

      </div>

      <div class="packages">

    `;

    packages.forEach(pkg=>{

      const field =
        fieldByCode[pkg.code];

      if(!field){
        return;
      }

      const count =
        row
          ? Number(row[field]) || 0
          : 0;

      const fullBonus =
        Number(pkg.bonus) || 0;

      const employeeBonus =
        Number(pkg.employee_bonus) || 0;

      const adminBonus =
        Number(pkg.admin_bonus) || 0;

      html += `

      <div class="packageBox">

        <div class="packageName">
          ${escapeHtml(pkg.name || pkg.code)}
        </div>

        <div class="packagePrice">
          ${money(pkg.price)}
        </div>

        <div class="salesRow">

          <input
            type="number"
            min="0"
            class="packageInput"
            value="${count}"
            onchange="
              changeSale(
                ${employee.id},
                '${field}',
                this.value
              )
            "
          >

          <span>վաճառք</span>

        </div>

        <div class="bonusBlock">

          <div class="bonusLine">
            <span class="bonusLabel">
              🎁 Ընդհանուր բոնուս
            </span>

            <span class="bonusNumber totalColor">
              ${money(fullBonus)}
            </span>
          </div>

          <button
            class="editBtn totalBtn"
            onclick="
              editTotalBonus(
                ${pkg.id},
                '${escapeJs(pkg.name || pkg.code)}',
                ${fullBonus}
              )
            "
          >
            Փոխել ընդհանուր բոնուսը
          </button>


          <div class="bonusLine">
            <span class="bonusLabel">
              👤 Աշխատակցի բոնուս
            </span>

            <span class="bonusNumber employeeColor">
              ${money(employeeBonus)}
            </span>
          </div>

          <button
            class="editBtn employeeBtn"
            onclick="
              editEmployeeBonus(
                ${pkg.id},
                '${escapeJs(pkg.name || pkg.code)}',
                ${employeeBonus}
              )
            "
          >
            Փոխել աշխատակցի բոնուսը
          </button>


          <div class="bonusLine">
            <span class="bonusLabel">
              💰 Իմ բոնուս
            </span>

            <span class="bonusNumber adminColor">
              ${money(adminBonus)}
            </span>
          </div>

          <button
            class="editBtn adminBtn"
            onclick="
              editAdminBonus(
                ${pkg.id},
                '${escapeJs(pkg.name || pkg.code)}',
                ${adminBonus}
              )
            "
          >
            Փոխել իմ բոնուսը
          </button>

        </div>

      </div>

      `;

    });

    html += `
      </div>
    </div>
    `;

  });

  document.getElementById(
    "employees"
  ).innerHTML =
    html ||
    "<div class='status'>Աշխատակից չկա</div>";

}

async function editTotalBonus(
  id,
  name,
  oldValue
){

  if(!askPassword())
    return;

  const value =
    prompt(
      name +
      "\nԸնդհանուր բոնուսը",
      oldValue
    );

  if(value === null)
    return;

  const bonus =
    Number(value);

  if(
    !Number.isFinite(bonus) ||
    bonus < 0
  ){

    alert("Մուտքագրեք ճիշտ թիվ");
    return;

  }

  const result =
    await db
      .from("packages")
      .update({
        bonus:bonus,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    console.error(result.error);
    alert("Չհաջողվեց պահպանել");

    return;

  }

  await loadAll();

}

async function editEmployeeBonus(
  id,
  name,
  oldValue
){

  if(!askPassword())
    return;

  const value =
    prompt(
      name +
      "\nԱշխատակցի բոնուսը",
      oldValue
    );

  if(value === null)
    return;

  const bonus =
    Number(value);

  if(
    !Number.isFinite(bonus) ||
    bonus < 0
  ){

    alert("Մուտքագրեք ճիշտ թիվ");
    return;

  }

  const result =
    await db
      .from("packages")
      .update({
        employee_bonus:bonus,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    console.error(result.error);

async function changeSale(
  employeeId,
  field,
  value
){

  if(!askPassword()){

    renderEmployees();
    return;

  }

  const count =
    Math.max(
      0,
      Number(value) || 0
    );

  const existing =
    getTodayRow(employeeId);

  try{

    if(existing){

      const update = {};

      update[field] =
        count;

      update.updated_at =
        new Date().toISOString();

      const result =
        await db
          .from("daily_sales")
          .update(update)
          .eq("id",existing.id);

      if(result.error)
        throw result.error;

    }
    else{

      const row = {

        employee_id:
          employeeId,

        sale_date:
          currentDay,

        package_3900:0,
        package_4900:0,
        package_5900:0,

        package_6900:0,
        package_7900:0,
        package_8900:0,

        package_iptv1:0,
        package_iptv2:0,
        package_iptv3:0

      };

      row[field] =
        count;

      const result =
        await db
          .from("daily_sales")
          .insert(row);

      if(result.error)
        throw result.error;

    }

    await loadAll();

  }
  catch(error){

    console.error(error);

    alert(
      "Չհաջողվեց պահպանել վաճառքը"
    );

    await loadAll();

  }

}

function renderHistory(){

  const oldSales =
    allSales.filter(
      row =>
        row.sale_date !== currentDay
    );

  if(!oldSales.length){

    document.getElementById(
      "history"
    ).innerHTML =
      "<div class='status'>Պատմություն դեռ չկա</div>";

    return;

  }

  const grouped = {};

  oldSales.forEach(row=>{

    if(!grouped[row.sale_date]){
      grouped[row.sale_date] = [];
    }

    grouped[row.sale_date].push(row);

  });

  let html = "";

  Object.keys(grouped)
    .sort()
    .reverse()
    .forEach(date=>{

      let sales = 0;
      let full = 0;
      let employee = 0;
      let admin = 0;

      grouped[date].forEach(row=>{

        const t =
          calculateRow(row);

        sales += t.sales;
        full += t.fullBonus;
        employee += t.employeeBonus;
        admin += t.adminBonus;

      });

      html += `

      <div class="historyCard">

        <div class="historyDate">
          ${date}
        </div>

        <div class="historyInfo">

          ${sales} վաճառք

          <br>

          Ընդհանուր՝
          ${money(full)}

          • Աշխատակիցներին՝
          ${money(employee)}

          • Ինձ՝
          +${money(admin)}

        </div>

      </div>

      `;

    });

  document.getElementById(
    "history"
  ).innerHTML =
    html;

}

function downloadTodayExcel(){

  const rows = [

    [
      "HOME TELECOM — ԱՅՍՕՐՎԱ ԱՐԴՅՈՒՆՔ"
    ],

    [],

    [
      "Աշխատակից",
      "Վաճառք",
      "Ընդհանուր բոնուս",
      "Աշխատակցի բոնուս",
      "Իմ բոնուս"
    ]

  ];

  employees.forEach(employee=>{

    const t =
      calculateRow(
        getTodayRow(employee.id)
      );

    rows.push([

      employee.name,
      t.sales,
      t.fullBonus,
      t.employeeBonus,
      t.adminBonus

    ]);

  });

  const ws =
    XLSX.utils.aoa_to_sheet(
      rows
    );

  const wb =
    XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Այսօր"
  );

  XLSX.writeFile(
    wb,
    "Այսօրվա վաճառքները.xlsx"
  );

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeJs(text){

  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}
