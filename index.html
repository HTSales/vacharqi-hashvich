<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #08101d;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

/* ԼՈԳՈ */
.logo {
  display: block;
  width: 210px;
  max-width: 70%;
  height: auto;
  margin: 10px auto 20px;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

h1 {
  margin: 5px 0;
  font-size: 30px;
}

.subtitle {
  color: #9aa8c8;
  font-size: 15px;
}

/* ԱՇԽԱՏԱԿԻՑ */
.employee {
  background: #121a2f;
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 18px;
}

.employeeTop {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 15px;
}

.name {
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  border: 1px solid #34415f;
  background: #0d1528;
  color: white;
  font-size: 18px;
}

.remove {
  border: none;
  background: #3a1820;
  color: #ff8b9a;
  border-radius: 12px;
  padding: 13px;
  font-size: 18px;
}

/* ՓԱԹԵԹՆԵՐ */
.packages {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.package {
  background: #1a2540;
  border-radius: 15px;
  padding: 12px;
}

.packagePrice {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 4px;
}

.packageBonus {
  color: #6de4ba;
  font-size: 12px;
  margin-bottom: 8px;
}

.counter {
  display: flex;
  align-items: center;
  gap: 8px;
}

.counter button {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: #287cf5;
  color: white;
  font-size: 23px;
  font-weight: bold;
}

.count {
  flex: 1;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* ԱՇԽԱՏԱԿՑԻ ԱՐԴՅՈՒՆՔ */
.employeeResult {
  margin-top: 15px;
  padding: 14px;
  border-radius: 14px;
  background: #0d1528;
}

.employeeResultRow {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

.employeeBonus {
  color: #6de4ba;
  font-weight: 800;
}

/* ԱՎԵԼԱՑՆԵԼ */
.addEmployee {
  width: 100%;
  border: none;
  padding: 16px;
  border-radius: 15px;
  background: #287cf5;
  color: white;
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 20px;
}

/* ԸՆԴՀԱՆՈՒՐ */
.total {
  background: #12352f;
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 30px;
}

.total h2 {
  margin-top: 0;
}

.totalRow {
  display: flex;
  justify-content: space-between;
  padding: 9px 0;
  border-bottom: 1px solid rgba(255,255,255,.1);
}

.totalRow:last-child {
  border-bottom: none;
}

.big {
  color: #66efbd;
  font-size: 25px;
  font-weight: 900;
}

@media(max-width:500px) {
  .packages {
    grid-template-columns: 1fr 1fr;
  }

  .container {
    padding: 14px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- ԼՈԳՈ -->
  <img src="IMG_7968.png" alt="Telecom" class="logo">

  <div class="header">
    <h1>Վաճառքի Հաշվիչ</h1>
    <div class="subtitle">
      Աշխատակիցների վաճառքներ և բոնուսներ
    </div>
  </div>

  <div id="employees"></div>

  <button class="addEmployee" onclick="addEmployee()">
    + Ավելացնել աշխատակից
  </button>

  <div class="total">

    <h2>Ընդհանուր արդյունք</h2>

    <div class="totalRow">
      <span>Ընդհանուր վաճառքների քանակ</span>
      <strong id="allSalesCount">0</strong>
    </div>

    <div class="totalRow">
      <span>Ընդհանուր վաճառքի գումար</span>
      <strong id="allRevenue">0 դրամ</strong>
    </div>

    <div class="totalRow">
      <span>Ընդհանուր բոնուս</span>
      <strong class="big" id="allBonus">0 դրամ</strong>
    </div>

  </div>

</div>

<script>

const packages = [
  {price:3900, bonus:1000},
  {price:4900, bonus:1200},
  {price:5900, bonus:2000},
  {price:6900, bonus:1500},
  {price:7900, bonus:3000},
  {price:8900, bonus:2500}
];

let employeeId = 0;

function money(number) {
  return new Intl.NumberFormat("hy-AM").format(number) + " դրամ";
}

function addEmployee() {

  employeeId++;

  const employee = document.createElement("div");
  employee.className = "employee";
  employee.dataset.id = employeeId;

  let savedName = localStorage.getItem("employeeName_" + employeeId) || "";

  let packageHTML = "";

  packages.forEach(function(item) {

    packageHTML += `
      <div class="package">

        <div class="packagePrice">
          ${item.price.toLocaleString()} դր.
        </div>

        <div class="packageBonus">
          Բոնուս՝ ${item.bonus.toLocaleString()} դր.
        </div>

        <div class="counter">

          <button onclick="changeCount(this,-1)">
            −
          </button>

          <span
            class="count"
            data-price="${item.price}"
            data-bonus="${item.bonus}">
            0
          </span>

          <button onclick="changeCount(this,1)">
            +
          </button>

        </div>

      </div>
    `;
  });

  employee.innerHTML = `

    <div class="employeeTop">

      <input
        class="name"
        type="text"
        placeholder="Աշխատակցի անուն"
        value="${savedName}"
        oninput="saveName(this)"
      >

      <button
        class="remove"
        onclick="removeEmployee(this)">
        ✕
      </button>

    </div>

    <div class="packages">
      ${packageHTML}
    </div>

    <div class="employeeResult">

      <div class="employeeResultRow">
        <span>Վաճառքներ</span>
        <strong class="employeeSales">0</strong>
      </div>

      <div class="employeeResultRow">
        <span>Բոնուս</span>
        <strong class="employeeBonus">
          0 դրամ
        </strong>
      </div>

    </div>
  `;

  document.getElementById("employees").appendChild(employee);

  calculate();
}

function changeCount(button, amount) {

  const counter = button.parentElement;
  const countElement = counter.querySelector(".count");

  let count = Number(countElement.textContent);

  count += amount;

  if (count < 0) {
    count = 0;
  }

  countElement.textContent = count;

  calculate();
}

function saveName(input) {

  const employee = input.closest(".employee");
  const id = employee.dataset.id;

  localStorage.setItem(
    "employeeName_" + id,
    input.value
  );
}

function removeEmployee(button) {

  const employee = button.closest(".employee");

  employee.remove();

  calculate();
}

function calculate() {

  let allSalesCount = 0;
  let allRevenue = 0;
  let allBonus = 0;

  document
    .querySelectorAll(".employee")
    .forEach(function(employee) {

      let employeeSales = 0;
      let employeeBonus = 0;

      employee
        .querySelectorAll(".count")
        .forEach(function(item) {

          const count = Number(item.textContent) || 0;
          const price = Number(item.dataset.price);
          const bonus = Number(item.dataset.bonus);

          employeeSales += count;

          employeeBonus +=
            count * bonus;

          allSalesCount += count;

          allRevenue +=
            count * price;

          allBonus +=
            count * bonus;
        });

      employee
        .querySelector(".employeeSales")
        .textContent = employeeSales;

      employee
        .querySelector(".employeeBonus")
        .textContent = money(employeeBonus);
    });

  document
    .getElementById("allSalesCount")
    .textContent = allSalesCount;

  document
    .getElementById("allRevenue")
    .textContent = money(allRevenue);

  document
    .getElementById("allBonus")
    .textContent = money(allBonus);
}

/* Սկզբում մեկ աշխատակից */
addEmployee();

</script>

</body>
</html>
