function money(number){

  return new Intl.NumberFormat(
    "hy-AM"
  ).format(
    Math.round(Number(number) || 0)
  ) + " դրամ";

}


function yerevanDate(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Yerevan",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );

  const map = {};

  parts.forEach(p=>{
    map[p.type] = p.value;
  });

  return (
    map.year +
    "-" +
    map.month +
    "-" +
    map.day
  );

}


function updateClock(){

  const now =
    new Date();

  document.getElementById(
    "clockText"
  ).textContent =
    now.toLocaleTimeString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById(
    "dateText"
  ).textContent =
    now.toLocaleDateString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}


function passwordOK(){

  return prompt(
    "Admin գաղտնաբառ"
  ) === ADMIN_PASSWORD;

}


function orderedPackages(list){

  return [...list].sort(
    (a,b)=>{
      return (
        packageOrder.indexOf(a.code) -
        packageOrder.indexOf(b.code)
      );
    }
  );

}


function todayRow(employeeId){

  return todaySales.find(
    x =>
      Number(x.employee_id) ===
      Number(employeeId)
  );

}


function calculate(row){

  let sales = 0;
  let revenue = 0;
  let fullBonus = 0;
  let employeeBonus = 0;
  let adminBonus = 0;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field){
      return;
    }

    const count =
      Number(
        row ? row[field] : 0
      ) || 0;

    sales += count;

    revenue +=
      count *
      Number(pkg.price || 0);

    fullBonus +=
      count *
      Number(pkg.bonus || 0);

    employeeBonus +=
      count *
      Number(pkg.employee_bonus || 0);

    adminBonus +=
      count *
      Number(pkg.admin_bonus || 0);

  });

  return {
    sales,
    revenue,
    fullBonus,
    employeeBonus,
    adminBonus
  };

}
