<body>

<div class="container">

<div class="dateBox">

  <div class="summaryCard">

  </div>

  <div class="summaryCard">
    <div class="summaryLabel">Աշխատակիցներին</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const PASSWORD = "1234";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {

  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",

  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",

  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"

};

const packageOrder = [

  "home_standard",
  "home_premium",
  "home_ultima",

  "inet1",
  "inet2",
  "inet3",

  "iptv1",
  "iptv2",
  "iptv3"

];

let employees = [];
let packages = [];
let allSales = [];
let todaySales = [];
let currentDay = "";

function money(n){

  return new Intl.NumberFormat("hy-AM")
    .format(Math.round(Number(n)||0))
    + " դրամ";

}

function localDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}

function askPassword(){

  return prompt(
    "Մուտքագրեք Admin գաղտնաբառը"
  ) === PASSWORD;

}

function updateClock(){

  const d = new Date();

  document.getElementById(
    "clock"
  ).textContent =
    d.toLocaleTimeString(
      "hy-AM",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById(
    "todayText"
  ).textContent =
    d.toLocaleDateString(
      "hy-AM",
      {
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );

}

function sortPackages(list){

  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );

}

async function loadAll(){

  currentDay =
    localDateKey();

  document.getElementById(
    "status"
  ).textContent =
    "Տվյալները բեռնվում են...";

  try{

    const [
      employeesRes,
      packagesRes,
      salesRes
    ] =
    await Promise.all([

      db
        .from("employees")
        .select("*")
        .eq("active",true)
        .order("name"),

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .order(
          "sale_date",
          {ascending:false}
        )

    ]);

    if(employeesRes.error)
      throw employeesRes.error;

    if(packagesRes.error)
      throw packagesRes.error;

    if(salesRes.error)
      throw salesRes.error;

    employees =
      employeesRes.data || [];

    packages =
      sortPackages(
        packagesRes.data || []
      );

    allSales =
      salesRes.data || [];

    todaySales =
      allSales.filter(
        row =>
          row.sale_date === currentDay
      );

    renderEmployees();
    renderSummary();

    document.getElementById(
      "status"
    ).textContent =
      "● Տվյալները թարմացված են";

  }
  catch(error){

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "Տվյալները բեռնել չհաջողվեց";

  }

}

function getTodayRow(employeeId){

  return todaySales.find(
    row =>
      Number(row.employee_id)
      ===
      Number(employeeId)
  );

}

function calculateRow(row){

  let sales = 0;
  let totalBonus = 0;
  let employeeBonus = 0;
  let adminBonus = 0;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field)
      return;

    const count =
      Number(
        row ? row[field] : 0
      ) || 0;

    sales += count;

    totalBonus +=
      count *
      Number(pkg.bonus || 0);

    employeeBonus +=
      count *
      Number(pkg.employee_bonus || 0);

    adminBonus +=
      count *
      Number(pkg.admin_bonus || 0);

  });

  return {
    sales,
    totalBonus,
    employeeBonus,
    adminBonus
  };

}

function renderSummary(){

  let todaySalesCount = 0;
  let todayTotal = 0;
  let todayEmployee = 0;
  let todayAdmin = 0;

  let allAdmin = 0;

  let best = null;

  todaySales.forEach(row=>{

    const t =
      calculateRow(row);

    todaySalesCount +=
      t.sales;

    todayTotal +=
      t.totalBonus;

    todayEmployee +=
      t.employeeBonus;

    todayAdmin +=
      t.adminBonus;

  });

  allSales.forEach(row=>{

    const t =
      calculateRow(row);

    allAdmin +=
      t.adminBonus;

  });

  employees.forEach(employee=>{

    const t =
      calculateRow(
        getTodayRow(employee.id)
      );

    if(
      !best ||
      t.sales > best.sales
    ){

      best = {
        name:employee.name,
        sales:t.sales,
        bonus:t.employeeBonus
      };

    }

  });

  document.getElementById(
    "summarySales"
  ).textContent =
    todaySalesCount;

  document.getElementById(
    "summaryBonus"
  ).textContent =
    money(todayTotal);

  document.getElementById(
    "summaryEmployeeBonus"
  ).textContent =
    money(todayEmployee);

  document.getElementById(
    "myTotalBonus"
  ).textContent =
    money(allAdmin);

  document.getElementById(
    "todayMyBonus"
  ).textContent =
    "Այսօր +" +
    money(todayAdmin);

  if(best && best.sales>0){

    document.getElementById(
      "bestName"
    ).textContent =
      best.name;

    document.getElementById(
      "bestInfo"
    ).textContent =
      best.sales +
      " վաճառք • " +
      money(best.bonus) +
      " բոնուս";

  }
  else{

    document.getElementById(
      "bestName"
    ).textContent =
      "—";

    document.getElementById(
      "bestInfo"
    ).textContent =
      "Այսօր դեռ վաճառք չկա";

  }

}

function renderEmployees(){

  let html = "";

  employees.forEach(employee=>{

    const row =
      getTodayRow(employee.id);

    const totals =
      calculateRow(row);

    html += `

    <div class="employeeCard">

      <div class="employeeName">
        ${escapeHtml(employee.name)}
      </div>

      <div class="employeeTotals">
        ${totals.sales} վաճառք •
        Աշխատակցին՝ ${money(totals.employeeBonus)} •
        Ինձ՝ ${money(totals.adminBonus)}
      </div>

      <div class="packages">

    `;

    packages.forEach(pkg=>{

      const field =
        fieldByCode[pkg.code];

      if(!field)
        return;

      const count =
        row
          ? Number(row[field]) || 0
          : 0;

      html += `

      <div class="packageBox">

        <div class="packageName">
          ${escapeHtml(pkg.name || pkg.code)}
        </div>

        <div class="packagePrice">
          ${money(pkg.price)}
        </div>

        <div class="salesRow">

          <input
            type="number"
            min="0"
            class="packageInput"
            value="${count}"
            onchange="
              changeSale(
                ${employee.id},
                '${field}',
                this.value
              )
            "
          >

          <span>
            վաճառք
          </span>

        </div>

        <div class="bonusBlock">

          <div class="bonusLine">

            <span class="bonusText">
              🎁 Ընդհանուր բոնուս
            </span>

            <span class="bonusNumber totalBonus">
              ${money(pkg.bonus)}
            </span>

          </div>

          <button
            class="editBtn totalBtn"
            onclick="
              editTotalBonus(
                ${pkg.id},
                '${escapeJs(pkg.name)}',
                ${pkg.bonus}
              )
            "
          >
            Փոխել ընդհանուր բոնուսը
          </button>

          <div class="bonusLine" style="margin-top:10px">

            <span class="bonusText">
              👤 Աշխատակցի բոնուս
            </span>

            <span class="bonusNumber employeeBonus">
              ${money(pkg.employee_bonus)}
            </span>

          </div>

          <button
            class="editBtn employeeBtn"
            onclick="
              editEmployeeBonus(
                ${pkg.id},
                '${escapeJs(pkg.name)}',
                ${pkg.bonus},
                ${pkg.employee_bonus}
              )
            "
          >
            Փոխել աշխատակցի բոնուսը
          </button>

          <div class="bonusLine" style="margin-top:10px">

            <span class="bonusText">
              💰 Իմ բոնուս
            </span>

            <span class="bonusNumber adminBonus">
              ${money(pkg.admin_bonus)}
            </span>

          </div>

          <button
            class="editBtn adminBtn"
            onclick="
              editAdminBonus(
                ${pkg.id},
                '${escapeJs(pkg.name)}',
                ${pkg.bonus},
                ${pkg.admin_bonus}
              )
            "
          >
            Փոխել իմ բոնուսը
          </button>

        </div>

      </div>

      `;

    });

    html += `
      </div>
    </div>
    `;

  });

  document.getElementById(
    "employees"
  ).innerHTML =
    html;

}

async function editTotalBonus(
  id,
  name,
  oldBonus
){

  if(!askPassword())
    return;

  const value =
    prompt(
      name +
      "\nԸնդհանուր բոնուսը",
      oldBonus
    );

  if(value === null)
    return;

  const total =
    Number(value);

  if(
    !Number.isFinite(total) ||
    total < 0
  )
    return;

  const employee =
    Math.floor(total / 2);

  const admin =
    total - employee;

  const result =
    await db
      .from("packages")
      .update({
        bonus:total,
        employee_bonus:employee,
        admin_bonus:admin,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    alert("Չհաջողվեց պահպանել");

    return;

  }

  await loadAll();

}

async function editEmployeeBonus(
  id,
  name,
  total,
  oldValue
){

  if(!askPassword())
    return;

  const value =
    prompt(
      name +
      "\nԱշխատակցի բոնուսը",
      oldValue
    );

  if(value === null)
    return;

  const employee =
    Number(value);

  if(
    !Number.isFinite(employee) ||
    employee < 0 ||
    employee > total
  ){

    alert(
      "Աշխատակցի բոնուսը չի կարող գերազանցել ընդհանուր բոնուսը"
    );

    return;

  }

  const admin =
    total - employee;

  const result =
    await db
      .from("packages")
      .update({
        employee_bonus:employee,
        admin_bonus:admin,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    alert("Չհաջողվեց պահպանել");

    return;

  }

  await loadAll();

}

async function editAdminBonus(
  id,
  name,
  total,
  oldValue
){

  if(!askPassword())
    return;

  const value =
    prompt(
      name +
      "\nԻմ բոնուսը",
      oldValue
    );

  if(value === null)
    return;

  const admin =
    Number(value);

  if(
    !Number.isFinite(admin) ||
    admin < 0 ||
    admin > total
  ){

    alert(
      "Քո բոնուսը չի կարող գերազանցել ընդհանուր բոնուսը"
    );

    return;

  }

  const employee =
    total - admin;

  const result =
    await db
      .from("packages")
      .update({
        admin_bonus:admin,
        employee_bonus:employee,
        updated_at:
          new Date().toISOString()
      })
      .eq("id",id);

  if(result.error){

    alert("Չհաջողվեց պահպանել");

    return;

  }

  await loadAll();

}

async function changeSale(
  employeeId,
  field,
  value
){

  if(!askPassword()){

    renderEmployees();

    return;

  }

  const count =
    Math.max(
      0,
      Number(value) || 0
    );

  const existing =
    getTodayRow(employeeId);

  try{

    if(existing){

      const data = {};

      data[field] =
        count;

      data.updated_at =
        new Date().toISOString();

      const result =
        await db
          .from("daily_sales")
          .update(data)
          .eq(
            "id",
            existing.id
          );

      if(result.error)
        throw result.error;

    }
    else{

      const data = {

        employee_id:
          employeeId,

        sale_date:
          currentDay,

        package_3900:0,
        package_4900:0,
        package_5900:0,

        package_6900:0,
        package_7900:0,
        package_8900:0,

        package_iptv1:0,
        package_iptv2:0,
        package_iptv3:0

      };

      data[field] =
        count;

      const result =
        await db
          .from("daily_sales")
          .insert(data);

      if(result.error)
        throw result.error;

    }

    await loadAll();

  }
  catch(error){

    console.error(error);

    alert(
      "Չհաջողվեց պահպանել վաճառքը"
    );

    await loadAll();

  }

}

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeJs(text){

  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");

}

updateClock();

setInterval(
  updateClock,
  1000
);

setInterval(
  ()=>{

    if(
      localDateKey() !== currentDay
    ){
      loadAll();
    }

  },
  5000
);
