<style>
*{
  box-sizing:border-box;
}

html{
  background:#08101d;
}

body{
  margin:0;
  min-height:100vh;
  background:#08101d;

}

.summaryValue{

.bestCard{

}

.employeeCard{

  border-radius:18px;
  padding:15px;
  margin-bottom:12px;
}

.employeeTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:13px;
}

.employeeName{
  font-size:20px;
  font-weight:900;

.employeeTotals{
  font-size:12px;

  margin-top:4px;
}

.smallBtn{
  border-radius:10px;
  padding:9px 10px;
  background:#1d2c45;

  font-size:12px;
}

.deleteBtn{
  background:#4a1d28;

}

.packages{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));

}

.packageBox{
  background:#0b1526;
  border-radius:13px;

}

.packageName{

}

.packagePrice{

  margin-top:3px;

.packageRow{
  display:flex;

  align-items:center;
}

.packageInput{
  width:68px;
  background:#15233a;
  color:#fff;
  border:1px solid #2c3b56;
  border-radius:9px;
  padding:9px;
  font-size:16px;
  text-align:center;
  outline:none;
}

.packageBonus{
  font-size:11px;
  color:#8d9ab5;
  flex:1;
}

.editBonusBtn{
  margin-top:8px;

}

.addBox{
  background:#111c30;
  border-radius:18px;
  padding:14px;

}

.addRow{
  display:flex;

}

.addInput{
  flex:1;
  min-width:0;
  background:#0b1526;
  color:#fff;
  border:1px solid #2c3b56;
  border-radius:11px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.addBtn{
  border-radius:11px;
  padding:0 15px;
  background:#16794d;
  color:#fff;
  font-weight:900;
}

.historyCard{
  background:#111c30;
  border-radius:16px;
  padding:14px;
  margin-bottom:9px;
}

.historyTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.historyDate{
  font-weight:900;
}

.historyInfo{
  margin-top:5px;
  font-size:12px;
  color:#8d9ab5;
}

.historyBtn{
  padding:9px 11px;
  border-radius:10px;
  background:#16794d;
  color:#fff;
  font-size:11px;
  font-weight:900;
}

.status{
  text-align:center;
  color:#8d9ab5;
  font-size:12px;
  min-height:18px;
  margin:8px 0;
}

@media(max-width:700px){
  .packages{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:560px){
  .summaryGrid{
    grid-template-columns:1fr;
  }

  .packages{
    grid-template-columns:1fr;
  }

  .toolbar{
    grid-template-columns:1fr;
  }
}

<body>

<div class="container">

<img src="./IMG_7968.png" class="logo" alt="Home Telecom">

<div class="header">
  <h1>Վաճառքի Admin Panel</h1>
  <div class="subtitle">Home Telecom</div>
</div>

<div class="dateBox">
  <div class="dateBig" id="todayText"></div>
  <div class="clock" id="clock"></div>
</div>

<div class="summaryGrid">

  <div class="summaryCard">
    <div class="summaryLabel">Վաճառքներ</div>
    <div class="summaryValue" id="summarySales">0</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">Շրջանառություն</div>
    <div class="summaryValue" id="summaryRevenue">0 դրամ</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">Բոնուսներ</div>
    <div class="summaryValue" id="summaryBonus">0 դրամ</div>
  </div>

</div>

<div class="bestCard">

  <div class="bestTitle">
    🏆 Այսօրվա լավագույն աշխատակից
  </div>

  <div class="bestName" id="bestName">
    —
  </div>

  <div class="bestInfo" id="bestInfo">
    Այսօր դեռ վաճառք չկա
  </div>

  <button class="greenBtn" onclick="downloadTodayExcel()">
    📥 Այսօրվա Excel
  </button>

    🔄 Թարմացնել
  </button>

</div>

  Աշխատակիցներ
</div>

<div class="addBox">

  <div class="addRow">

    <input
      id="newEmployee"
      class="addInput"
      placeholder="Նոր աշխատակցի անուն"

    <button
      class="addBtn"
      onclick="addEmployee()"
    >
      Ավելացնել
    </button>

</div>

  Պատմություն
</div>

<div id="history"></div>

</div>

<script>

const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const PASSWORD = "1234";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* 9 ՓԱԹԵԹՆԵՐԻ ԴԱՇՏԵՐԸ */

const fieldByCode = {

  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",

  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",

  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"

};


/* ՓԱԹԵԹՆԵՐԻ ՑՈՒՑԱԴՐՄԱՆ ՀԵՐԹԱԿԱՆՈՒԹՅՈՒՆ */

const packageOrder = [

  "home_standard",
  "home_premium",
  "home_ultima",

  "inet1",
  "inet2",
  "inet3",

  "iptv1",
  "iptv2",
  "iptv3"

];


let employees = [];
let packages = [];
let todaySales = [];
let historySales = [];
let currentDay = "";


/* ԳՈՒՄԱՐ */

function money(n){

  return new Intl.NumberFormat("hy-AM")
    .format(Number(n) || 0)
    + " դրամ";
}


/* ԱՅՍՕՐՎԱ ՕՐԸ */

function localDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");
}


/* ԱՄՍԱԹԻՎ */

function prettyDate(dateString){

  const months = [
    "Հունվար",
    "Փետրվար",
    "Մարտ",
    "Ապրիլ",
    "Մայիս",
    "Հունիս",
    "Հուլիս",
    "Օգոստոս",
    "Սեպտեմբեր",
    "Հոկտեմբեր",
    "Նոյեմբեր",
    "Դեկտեմբեր"
  ];

  const p =
    dateString.split("-");

  return (
    Number(p[2]) +
    " " +
    months[Number(p[1])-1] +
    " " +
    p[0]
  );
}


/* STATUS */

function setStatus(text){

  document
    .getElementById("status")
    .textContent = text;
}


/* ԳԱՂՏՆԱԲԱՌ */

function askPassword(){

  const value =
    prompt(
      "Մուտքագրեք Admin գաղտնաբառը"
    );

  return value === PASSWORD;
}


/* ԺԱՄԱՑՈՒՅՑ */

function updateClock(){

  const d = new Date();

  document
    .getElementById("clock")
    .textContent =
      d.toLocaleTimeString(
        "hy-AM",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit",
          hour12:false
        }
      );

  document
    .getElementById("todayText")
    .textContent =
      d.toLocaleDateString(
        "hy-AM",
        {
          weekday:"long",
          day:"numeric",
          month:"long",
          year:"numeric"
        }
      );
}

updateClock();

setInterval(
  updateClock,
  1000
);


/* ՓԱԹԵԹՆԵՐԻ ՃԻՇՏ ՀԵՐԹԱԿԱՆՈՒԹՅՈՒՆ */

function sortPackages(list){

  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code)
      -
      packageOrder.indexOf(b.code)
  );
}


/* ԲԵՌՆԵԼ ԱՄԵՆ ԻՆՉ */

async function loadAll(){

  currentDay =
    localDateKey();

  setStatus(
    "Տվյալները բեռնվում են..."
  );

  try{

    const [
      employeesRes,
      packagesRes,
      todayRes,
      historyRes
    ] =
    await Promise.all([

      db
        .from("employees")
        .select("*")
        .eq("active",true)
        .order("name"),

      db
        .from("packages")
        .select("*"),

      db
        .from("daily_sales")
        .select("*")
        .eq(
          "sale_date",
          currentDay
        ),

      db
        .from("daily_sales")
        .select("*")
        .lt(
          "sale_date",
          currentDay
        )
        .order(
          "sale_date",
          {
            ascending:false
          }
        )

    ]);

    if(employeesRes.error)
      throw employeesRes.error;

    if(packagesRes.error)
      throw packagesRes.error;

    if(todayRes.error)
      throw todayRes.error;

    if(historyRes.error)
      throw historyRes.error;

    employees =
      employeesRes.data || [];

    packages =
      sortPackages(
        packagesRes.data || []
      );

    todaySales =
      todayRes.data || [];

    historySales =
      historyRes.data || [];

    renderEmployees();

    renderSummary();

    renderHistory();

    setStatus(
      "● Տվյալները թարմացված են"
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "Տվյալները բեռնել չհաջողվեց"
    );
  }
}


/* ԳՏՆԵԼ ԱՅՍՕՐՎԱ ՏՈՂԸ */

function getTodayRow(employeeId){

  return todaySales.find(
    row =>
      Number(row.employee_id)
      ===
      Number(employeeId)
  );
}


/* ԱՇԽԱՏԱԿԻՑՆԵՐ */

function renderEmployees(){

  const box =
    document.getElementById(
      "employees"
    );

  let html = "";

  employees.forEach(employee=>{

    const row =
      getTodayRow(
        employee.id
      );

    let employeeSales = 0;
    let employeeBonus = 0;

    packages.forEach(pkg=>{

      const field =
        fieldByCode[
          pkg.code
        ];

      if(!field){
        return;
      }

      const count =
        row
          ? Number(
              row[field]
            ) || 0
          : 0;

      employeeSales +=
        count;

      employeeBonus +=
        count *
        Number(pkg.bonus || 0);
    });

    html += `

      <div class="employeeCard">

        <div class="employeeTop">

          <div>

            <div class="employeeName">
              ${escapeHtml(employee.name)}
            </div>

            <div class="employeeTotals">
              ${employeeSales} վաճառք •
              ${money(employeeBonus)} բոնուս
            </div>

          </div>

          <div>

            <button
              class="smallBtn"
              onclick="renameEmployee(
                ${employee.id},
                '${escapeJs(employee.name)}'
              )"
            >
              ✏️
            </button>

            <button
              class="smallBtn deleteBtn"
              onclick="deleteEmployee(
                ${employee.id},
                '${escapeJs(employee.name)}'
              )"
            >
              🗑
            </button>

          </div>

        </div>

        <div class="packages">

    `;

    packages.forEach(pkg=>{

      const field =
        fieldByCode[
          pkg.code
        ];

      if(!field){
        return;
      }

      const count =
        row
          ? Number(
              row[field]
            ) || 0
          : 0;

      html += `

        <div class="packageBox">

          <div class="packageName">
            ${escapeHtml(pkg.name || pkg.code)}
          </div>

          <div class="packagePrice">
            ${money(pkg.price)}
          </div>

          <div class="packageRow">

            <input
              type="number"
              min="0"
              class="packageInput"
              value="${count}"
              onchange="
                changeSale(
                  ${employee.id},
                  '${field}',
                  this.value
                )
              "
            >

            <div class="packageBonus">
              1 վաճառքից՝
              ${money(pkg.bonus)}
            </div>

          </div>

          <button
            class="editBonusBtn"
            onclick="
              editBonus(
                ${pkg.id},
                '${escapeJs(pkg.name || pkg.code)}',
                ${pkg.price},
                ${pkg.bonus}
              )
            "
          >
            Փոխել բոնուսը
          </button>

        </div>

      `;
    });

    html += `

        </div>

      </div>

    `;
  });

  box.innerHTML =
    html ||
    "<div class='status'>Աշխատակից չկա</div>";
}


/* ՎԱՃԱՌՔԻ ՔԱՆԱԿԻ ՓՈՓՈԽՈՒԹՅՈՒՆ */

async function changeSale(
  employeeId,
  field,
  value
){

  if(!askPassword()){

    renderEmployees();

    return;
  }

  const count =
    Math.max(
      0,
      Number(value) || 0
    );

  const existing =
    getTodayRow(employeeId);

  try{

    if(existing){

      const updateData = {};

      updateData[field] =
        count;

      updateData.updated_at =
        new Date().toISOString();

      const result =
        await db
          .from("daily_sales")
          .update(updateData)
          .eq(
            "id",
            existing.id
          );

      if(result.error)
        throw result.error;

    }
    else{

      const newRow = {

        employee_id:
          employeeId,

        sale_date:
          currentDay,

        package_3900:0,
        package_4900:0,
        package_5900:0,

        package_6900:0,
        package_7900:0,
        package_8900:0,

        package_iptv1:0,
        package_iptv2:0,
        package_iptv3:0

      };

      newRow[field] =
        count;

      const result =
        await db
          .from("daily_sales")
          .insert(newRow);

      if(result.error)
        throw result.error;
    }

    await loadAll();

  }
  catch(error){

    console.error(error);

    alert(
      "Չհաջողվեց պահպանել վաճառքը"
    );

    await loadAll();
  }
}


/* ԲՈՆՈՒՍԻ ՓՈՓՈԽՈՒԹՅՈՒՆ */

async function editBonus(
  packageId,
  packageName,
  price,
  oldBonus
){

  if(!askPassword())
    return;

  const value =
    prompt(
      `${packageName} — ${price} դրամ\nՆոր բոնուսը`,
      oldBonus
    );

  if(value === null)
    return;

  const bonus =
    Number(value);

  if(
    !Number.isFinite(bonus)
    ||
    bonus < 0
  ){

    alert(
      "Մուտքագրեք ճիշտ թիվ"
    );

    return;
  }

  const result =
    await db
      .from("packages")
      .update({
        bonus:bonus,
        updated_at:
          new Date().toISOString()
      })
      .eq(
        "id",
        packageId
      );

  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Չհաջողվեց փոխել բոնուսը"
    );

    return;
  }

  await loadAll();
}


/* ՆՈՐ ԱՇԽԱՏԱԿԻՑ */

async function addEmployee(){

  if(!askPassword())
    return;

  const input =
    document.getElementById(
      "newEmployee"
    );

  const name =
    input.value.trim();

  if(!name){

    alert(
      "Գրեք աշխատակցի անունը"
    );

    return;
  }

  const result =
    await db
      .from("employees")
      .insert({
        name:name,
        active:true
      });

  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Չհաջողվեց ավելացնել աշխատակցին"
    );

    return;
  }

  input.value = "";

  await loadAll();
}


/* ԱՆՎԱՆ ՓՈՓՈԽՈՒԹՅՈՒՆ */

async function renameEmployee(
  id,
  oldName
){

  if(!askPassword())
    return;

  const name =
    prompt(
      "Աշխատակցի նոր անունը",
      oldName
    );

  if(name === null)
    return;

  const clean =
    name.trim();

  if(!clean)
    return;

  const result =
    await db
      .from("employees")
      .update({
        name:clean
      })
      .eq(
        "id",
        id
      );

  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Անունը փոխել չհաջողվեց"
    );

    return;
  }

  await loadAll();
}

){

      .from("employees")
      .update({

      })

/* ՀԱՇՎԱՐԿ */

function calculateRow(row){

  let sales = 0;
  let revenue = 0;
  let bonus = 0;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[
        pkg.code
      ];

    if(!field){
      return;
    }

    const count =
      Number(
        row
          ? row[field]
          : 0
      ) || 0;

    sales +=
      count;

    revenue +=
      count *
      Number(
        pkg.price || 0
      );

    bonus +=
      count *
      Number(
        pkg.bonus || 0
      );
  });

  return {
    sales,
    revenue,
    bonus
  };
}


/* ԸՆԴՀԱՆՈՒՐ ԱՄՓՈՓՈՒՄ */

function renderSummary(){

  let totalSales = 0;
  let totalRevenue = 0;
  let totalBonus = 0;

  let best = null;

  employees.forEach(
    employee=>{

      const row =
        getTodayRow(
          employee.id
        );

      const totals =
        calculateRow(row);

      totalSales +=
        totals.sales;

      totalRevenue +=
        totals.revenue;

      totalBonus +=
        totals.bonus;

      if(
        !best
        ||
        totals.sales > best.sales
        ||
        (
          totals.sales === best.sales
          &&
          totals.bonus > best.bonus
        )
      ){

        best = {
          name:employee.name,
          sales:totals.sales,
          bonus:totals.bonus
        };
      }
    }
  );

  document
    .getElementById(
      "summarySales"
    )
    .textContent =
      totalSales;

  document
    .getElementById(
      "summaryRevenue"
    )
    .textContent =
      money(totalRevenue);

  document
    .getElementById(
      "summaryBonus"
    )
    .textContent =
      money(totalBonus);

  if(
    best
    &&
    best.sales > 0
  ){

    document
      .getElementById(
        "bestName"
      )
      .textContent =
        best.name;

    document
      .getElementById(
        "bestInfo"
      )
      .textContent =
        `${best.sales} վաճառք • ${money(best.bonus)} բոնուս`;

  }
  else{

    document
      .getElementById(
        "bestName"
      )
      .textContent =
        "—";

    document
      .getElementById(
        "bestInfo"
      )
      .textContent =
        "Այսօր դեռ վաճառք չկա";
  }
}


/* ՊԱՏՄՈՒԹՅՈՒՆ */

function renderHistory(){

  const box =
    document.getElementById(
      "history"
    );

  if(
    historySales.length === 0
  ){

    box.innerHTML =
      "<div class='status'>Նախորդ օրերի տվյալ դեռ չկա</div>";

    return;
  }

  const grouped = {};

  historySales.forEach(
    row=>{

      if(
        !grouped[row.sale_date]
      ){

        grouped[
          row.sale_date
        ] = [];
      }

      grouped[
        row.sale_date
      ].push(row);
    }
  );

  let html = "";

  Object
    .keys(grouped)
    .sort()
    .reverse()
    .forEach(date=>{

      const rows =
        grouped[date];

      let totalSales = 0;
      let totalBonus = 0;
      let totalRevenue = 0;

      rows.forEach(row=>{

        const totals =
          calculateRow(row);

        totalSales +=
          totals.sales;

        totalBonus +=
          totals.bonus;

        totalRevenue +=
          totals.revenue;
      });

      html += `

        <div class="historyCard">

          <div class="historyTop">

            <div>

              <div class="historyDate">
                ${prettyDate(date)}
              </div>

              <div class="historyInfo">
                ${totalSales} վաճառք •
                ${money(totalRevenue)} շրջանառություն •
                ${money(totalBonus)} բոնուս
              </div>

            </div>

            <button
              class="historyBtn"
              onclick="downloadHistoryExcel('${date}')"
            >
              Excel
            </button>

          </div>

        </div>

      `;
    });

  box.innerHTML =
    html;
}

/* EXCEL ՍՏԵՂԾՈՒՄ */

function downloadExcelForDate(
  date,
  salesRows
){

  if(
    typeof XLSX ===
    "undefined"
  ){

    alert(
      "Excel համակարգը չի բեռնվել"
    );

    return;
  }

  const rows = [

    [
      "HOME TELECOM — ՎԱՃԱՌՔՆԵՐ"
    ],

    [],

    [
      "Ամսաթիվ",
      prettyDate(date)
    ],

    [],

    [
      "Աշխատակից",
      ...packages.map(
        p =>
          `${p.name} (${p.price})`
      ),
      "Ընդհանուր վաճառք",
      "Ընդհանուր բոնուս"
    ]

  ];

  let grandSales = 0;
  let grandBonus = 0;

  employees.forEach(
    employee=>{

      const saleRow =
        salesRows.find(
          row =>
            Number(
              row.employee_id
            )
            ===
            Number(
              employee.id
            )
        );

      let employeeSales = 0;
      let employeeBonus = 0;

      const packageCounts =
        packages.map(
          pkg=>{

            const field =
              fieldByCode[
                pkg.code
              ];

            const count =
              field && saleRow
                ? Number(
                    saleRow[field]
                  ) || 0
                : 0;

            employeeSales +=
              count;

            employeeBonus +=
              count *
              Number(
                pkg.bonus || 0
              );

            return count;
          }
        );

      grandSales +=
        employeeSales;

      grandBonus +=
        employeeBonus;

      rows.push([

        employee.name,

        ...packageCounts,

        employeeSales,

        employeeBonus +
        " դրամ"

      ]);
    }
  );

  rows.push([]);

  rows.push([
    "Ընդհանուր վաճառք",
    grandSales
  ]);

  rows.push([
    "Ընդհանուր բոնուս",
    grandBonus +
    " դրամ"
  ]);

  const ws =
    XLSX.utils
      .aoa_to_sheet(rows);

  ws["!cols"] = [
    {wch:26},
    ...packages.map(
      ()=>({wch:20})
    ),
    {wch:18},
    {wch:20}
  ];

  const wb =
    XLSX.utils.book_new();

  XLSX.utils
    .book_append_sheet(
      wb,
      ws,
      "Վաճառքներ"
    );

  const data =
    XLSX.write(
      wb,
      {
        bookType:"xlsx",
        type:"array"
      }
    );

  const blob =
    new Blob(
      [data],
      {
        type:
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    `Home Telecom ${date}.xlsx`;

  a.style.display =
    "none";

  document.body
    .appendChild(a);

  a.click();

  setTimeout(()=>{

    document.body
      .removeChild(a);

    URL
      .revokeObjectURL(url);

  },3000);
}


/* ՏԵՔՍՏԻ ԱՆՎՏԱՆԳ ՑՈՒՑԱԴՐՈՒՄ */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function escapeJs(text){

  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
