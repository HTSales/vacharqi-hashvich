<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:980px;
  margin:auto;
  padding:16px;
}

.logo{
  display:block;
  width:190px;
  max-width:60%;

}

.title{

}

.subtitle{

}

.dateBox{
  margin-top:14px;

  border-radius:18px;
  padding:14px;

.date{

}

.clock{
  margin-top:5px;
  color:#8f9bb2;
  font-size:13px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;

}

.summaryCard{

}

.summaryLabel{

}

.summaryValue{

}

  border-radius:18px;
  padding:16px;
}

  opacity:.8;
}

.adminBig{
  font-size:29px;
  font-weight:900;
  margin-top:5px;
}

.adminToday{

  font-weight:900;
}

.peopleSection{

}

.peopleTitle{

.personBtn{

  color:#fff;

}

.personBtn.active{

}

.addPersonBtn{
  flex:0 0 auto;
  padding:11px 15px;
  border:none;
  border-radius:12px;
  background:#1a7c55;
  color:#fff;
  font-weight:900;
  font-size:14px;
}

.employeePanel{
  margin-top:14px;
  background:#111c30;
  border-radius:20px;
  padding:16px;
}

.employeeTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}

.employeeName{
  font-size:26px;
  font-weight:900;
}

.employeeStats{
  margin-top:5px;
  color:#8f9bb2;
  font-size:12px;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:6px;
}

.actionBtn{
  border:none;
  border-radius:9px;
  padding:8px 10px;
  background:#1e2d45;
  color:#fff;
}

.deleteBtn{
  background:#55232e;
}

.packageGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  margin-top:15px;
}

.package{
  background:#0b1526;
  border-radius:15px;
  padding:13px;
}

.packageName{
  font-size:16px;
  font-weight:900;
}

.packagePrice{
  margin-top:3px;
  color:#8f9bb2;
  font-size:12px;
}

.salesRow{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:11px;
}

.saleInput{
  width:72px;
  padding:10px;
  border-radius:9px;
  border:1px solid #30405a;
  background:#15233a;
  color:#fff;
  text-align:center;
  font-size:17px;
}

.bonusBox{
  background:#101d31;
  border-radius:11px;
  padding:9px;
  margin-top:11px;
}

.bonusLine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:7px;
  margin:6px 0;
}

.bonusLabel{
  color:#8f9bb2;
  font-size:10px;
}

.bonusValue{
  font-size:12px;
  font-weight:900;
}

.employeeBonusColor{color:#6dc9ff}
.adminBonusColor{color:#75efb3}

.editBtn{
  width:100%;
  border:none;
  border-radius:8px;
  padding:7px;
  color:#fff;
  font-size:11px;
  font-weight:800;
  margin-top:4px;
}

.totalEdit{background:#443568}
.employeeEdit{background:#174c70}
.adminEdit{background:#185b42}

.empty{
  text-align:center;
  color:#8f9bb2;
  padding:35px 10px;
}

.status{
  text-align:center;
  color:#8f9bb2;
  font-size:12px;
  margin-top:12px;
}

@media(max-width:700px){
  .packageGrid{grid-template-columns:1fr 1fr}
}

@media(max-width:520px){
  .summary{grid-template-columns:1fr}
  .packageGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="container">

<img src="./IMG_7968.png" class="logo">

<div class="title">Վաճառքի Admin Panel</div>
<div class="subtitle">Home Telecom</div>

<div class="dateBox">
  <div class="date" id="dateText"></div>
  <div class="clock" id="clockText"></div>
</div>

<div class="summary">

  <div class="summaryCard">
    <div class="summaryLabel">Այսօրվա վաճառքներ</div>
    <div class="summaryValue" id="todaySales">0</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">Ընդհանուր բոնուս</div>
    <div class="summaryValue" id="todayFullBonus">0 դրամ</div>
  </div>

  <div class="summaryCard">
    <div class="summaryLabel">Աշխատակիցներին</div>
    <div class="summaryValue" id="todayEmployeeBonus">0 դրամ</div>
  </div>

</div>

<div class="adminCard">
  <small>💰 Իմ կուտակված բոնուսը</small>
  <div class="adminBig" id="allAdminBonus">0 դրամ</div>
  <div class="adminToday" id="todayAdminBonus">Այսօր +0 դրամ</div>
</div>

<div class="peopleSection">

  <div class="peopleTitle">
    Աշխատակիցներ
  </div>

  <div class="peopleRow" id="peopleRow"></div>

</div>

<div id="employeePanel"></div>

<div class="status" id="status"></div>

</div>

<script>
const SUPABASE_URL =
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const ADMIN_PASSWORD = "1234";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fieldByCode = {
  home_standard:"package_6900",
  home_premium:"package_7900",
  home_ultima:"package_8900",
  inet1:"package_3900",
  inet2:"package_4900",
  inet3:"package_5900",
  iptv1:"package_iptv1",
  iptv2:"package_iptv2",
  iptv3:"package_iptv3"
};

const packageOrder = [
  "home_standard",
  "home_premium",
  "home_ultima",
  "inet1",
  "inet2",
  "inet3",
  "iptv1",
  "iptv2",
  "iptv3"
];

let employees = [];
let packages = [];
let allSales = [];
let todaySales = [];

let selectedEmployeeId = null;
let currentDate = "";

function money(value){
  return new Intl.NumberFormat("hy-AM").format(
    Math.round(Number(value) || 0)
  ) + " դրամ";
}

function todayKey(){
  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Yerevan",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(new Date());

  const map = {};

  parts.forEach(x=>{
    map[x.type] = x.value;
  });

  return `${map.year}-${map.month}-${map.day}`;
}

function updateClock(){
  const now = new Date();

  document.getElementById("clockText").textContent =
    now.toLocaleTimeString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:false
      }
    );

  document.getElementById("dateText").textContent =
    now.toLocaleDateString(
      "hy-AM",
      {
        timeZone:"Asia/Yerevan",
        weekday:"long",
        day:"numeric",
        month:"long",
        year:"numeric"
      }
    );
}

function passwordOK(){
  return prompt("Admin գաղտնաբառ") === ADMIN_PASSWORD;
}

function orderedPackages(list){
  return [...list].sort(
    (a,b)=>
      packageOrder.indexOf(a.code) -
      packageOrder.indexOf(b.code)
  );
}

function getTodayRow(employeeId){
  return todaySales.find(
    row =>
      Number(row.employee_id) === Number(employeeId)
  );
}

function calculate(row){

  let sales = 0;
  let fullBonus = 0;
  let employeeBonus = 0;
  let adminBonus = 0;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field) return;

    const count =
      Number(
        row ? row[field] : 0
      ) || 0;

    sales += count;

    fullBonus +=
      count *
      Number(pkg.bonus || 0);

    employeeBonus +=
      count *
      Number(pkg.employee_bonus || 0);

    adminBonus +=
      count *
      Number(pkg.admin_bonus || 0);
  });

  return {
    sales,
    fullBonus,
    employeeBonus,
    adminBonus
  };
}

async function loadData(){

  currentDate = todayKey();

  document.getElementById("status").textContent =
    "Բեռնվում է...";

  try{

    const [empRes,pkgRes,salesRes] =
      await Promise.all([

        db
          .from("employees")
          .select("*")
          .eq("active",true)
          .order("name"),

        db
          .from("packages")
          .select("*"),

        db
          .from("daily_sales")
          .select("*")
          .order("sale_date",{ascending:false})

      ]);

    if(empRes.error) throw empRes.error;
    if(pkgRes.error) throw pkgRes.error;
    if(salesRes.error) throw salesRes.error;

    employees =
      empRes.data || [];

    packages =
      orderedPackages(
        pkgRes.data || []
      );

    allSales =
      salesRes.data || [];

    todaySales =
      allSales.filter(
        row =>
          row.sale_date === currentDate
      );

    if(
      selectedEmployeeId === null &&
      employees.length
    ){
      selectedEmployeeId =
        employees[0].id;
    }

    if(
      selectedEmployeeId !== null &&
      !employees.some(
        x =>
          Number(x.id) ===
          Number(selectedEmployeeId)
      )
    ){
      selectedEmployeeId =
        employees.length
        ? employees[0].id
        : null;
    }

    renderSummary();
    renderPeople();
    renderSelectedEmployee();

    document.getElementById("status").textContent =
      "● Թարմացված է";

  }
  catch(error){

    console.error(error);

    document.getElementById("status").textContent =
      "❌ Չհաջողվեց բեռնել տվյալները";
  }
}

function renderSummary(){

  let sales = 0;
  let full = 0;
  let employee = 0;
  let adminToday = 0;
  let adminAll = 0;

  todaySales.forEach(row=>{

    const total =
      calculate(row);

    sales += total.sales;
    full += total.fullBonus;
    employee += total.employeeBonus;
    adminToday += total.adminBonus;
  });

  allSales.forEach(row=>{
    adminAll +=
      calculate(row).adminBonus;
  });

  document.getElementById("todaySales").textContent =
    sales;

  document.getElementById("todayFullBonus").textContent =
    money(full);

  document.getElementById("todayEmployeeBonus").textContent =
    money(employee);

  document.getElementById("todayAdminBonus").textContent =
    "Այսօր +" + money(adminToday);

  document.getElementById("allAdminBonus").textContent =
    money(adminAll);
}

function renderPeople(){

  const container =
    document.getElementById("peopleRow");

  let html = "";

  employees.forEach(employee=>{

    const active =
      Number(employee.id) ===
      Number(selectedEmployeeId);

    html += `
      <button
        class="personBtn ${active ? "active" : ""}"
        onclick="selectEmployee(${employee.id})"
      >
        ${escapeHTML(employee.name)}
      </button>
    `;
  });

  html += `
    <button
      class="addPersonBtn"
      onclick="addEmployee()"
    >
      + Աշխատակից
    </button>
  `;

  container.innerHTML = html;
}

function selectEmployee(id){

  selectedEmployeeId = id;

  renderPeople();
  renderSelectedEmployee();
}

function renderSelectedEmployee(){

  const panel =
    document.getElementById("employeePanel");

  const employee =
    employees.find(
      x =>
        Number(x.id) ===
        Number(selectedEmployeeId)
    );

  if(!employee){

    panel.innerHTML =
      `<div class="empty">
        Աշխատակից դեռ չկա
      </div>`;

    return;
  }

  const row =
    getTodayRow(employee.id);

  const totals =
    calculate(row);

  let html = `

  <div class="employeePanel">

    <div class="employeeTop">

      <div>

        <div class="employeeName">
          ${escapeHTML(employee.name)}
        </div>

        <div class="employeeStats">
          Այսօր՝ ${totals.sales} վաճառք
          <br>
          Աշխատակցի բոնուս՝ ${money(totals.employeeBonus)}
          <br>
          Իմ բոնուս՝ ${money(totals.adminBonus)}
        </div>

      </div>

      <div class="actions">

        <button
          class="actionBtn"
          onclick="renameEmployee(
            ${employee.id},
            '${escapeJS(employee.name)}'
          )"
        >
          ✏️
        </button>

        <button
          class="actionBtn deleteBtn"
          onclick="removeEmployee(
            ${employee.id},
            '${escapeJS(employee.name)}'
          )"
        >
          🗑
        </button>

      </div>

    </div>

    <div class="packageGrid">
  `;

  packages.forEach(pkg=>{

    const field =
      fieldByCode[pkg.code];

    if(!field) return;

    const count =
      row
      ? Number(row[field]) || 0
      : 0;

    const totalBonus =
      Number(pkg.bonus) || 0;

    const employeeBonus =
      Number(pkg.employee_bonus) || 0;

    const adminBonus =
      Number(pkg.admin_bonus) || 0;

    html += `

    <div class="package">

      <div class="packageName">
        ${escapeHTML(pkg.name || pkg.code)}
      </div>

      <div class="packagePrice">
        ${money(pkg.price)}
      </div>

      <div class="salesRow">

        <input
          type="number"
          min="0"
          step="1"
          class="saleInput"
          value="${count}"
          onchange="
            changeSale(
              ${employee.id},
              '${field}',
              this.value
            )
          "
        >

        <span>վաճառք</span>

      </div>

      <div class="bonusBox">

        <div class="bonusLine">

          <span class="bonusLabel">
            🎁 Ընդհանուր
          </span>

          <span class="bonusValue">
            ${money(totalBonus)}
          </span>

        </div>

        <button
          class="editBtn totalEdit"
          onclick="
            changeTotalBonus(
              ${pkg.id},
              '${escapeJS(pkg.name || pkg.code)}',
              ${totalBonus}
            )
          "
        >
          Փոխել ընդհանուր բոնուսը
        </button>


        <div class="bonusLine">

          <span class="bonusLabel">
            👤 Աշխատակցին
          </span>

          <span class="bonusValue employeeBonusColor">
            ${money(employeeBonus)}
          </span>

        </div>

        <button
          class="editBtn employeeEdit"
          onclick="
            changeEmployeeBonus(
              ${pkg.id},
              '${escapeJS(pkg.name || pkg.code)}',
              ${employeeBonus}
            )
          "
        >
          Փոխել աշխատակցի բոնուսը
        </button>


        <div class="bonusLine">

          <span class="bonusLabel">
            💰 Ինձ
          </span>

          <span class="bonusValue adminBonusColor">
            ${money(adminBonus)}
          </span>

        </div>

        <button
          class="editBtn adminEdit"
          onclick="
            changeAdminBonus(
              ${pkg.id},
              '${escapeJS(pkg.name || pkg.code)}',
              ${adminBonus}
            )
          "
        >
          Փոխել իմ բոնուսը
        </button>

      </div>

    </div>
    `;
  });

  html += `
    </div>
  </div>
  `;

  panel.innerHTML = html;
}

async function addEmployee(){

  if(!passwordOK()) return;

  const answer =
    prompt("Նոր աշխատակցի անունը");

  if(answer === null) return;

  const name =
    answer.trim();

  if(!name){
    alert("Գրիր անունը");
    return;
  }

  try{

    const existing =
      await db
      .from("employees")
      .select("*")
      .ilike("name",name)
      .maybeSingle();

    if(existing.error)
      throw existing.error;

    if(existing.data){

      const result =
        await db
        .from("employees")
        .update({
          active:true,
          name:name
        })
        .eq(
          "id",
          existing.data.id
        );

      if(result.error)
        throw result.error;

      selectedEmployeeId =
        existing.data.id;

    }else{

      const result =
        await db
        .from("employees")
        .insert({
          name:name,
          active:true
        })
        .select()
        .single();

      if(result.error)
        throw result.error;

      selectedEmployeeId =
        result.data.id;
    }

    await loadData();

  }catch(error){

    console.error(error);

    alert(
      "Աշխատակից ավելացնել չհաջողվեց"
    );
  }
}

async function renameEmployee(id,currentName){

  if(!passwordOK()) return;

  const answer =
    prompt(
      "Աշխատակցի նոր անունը",
      currentName
    );

  if(answer === null) return;

  const name =
    answer.trim();

  if(!name) return;

  const result =
    await db
    .from("employees")
    .update({
      name:name
    })
    .eq("id",id);

  if(result.error){

    alert(
      "Անունը փոխել չհաջողվեց"
    );

    return;
  }

  await loadData();
}

async function removeEmployee(id,name){

  if(!passwordOK()) return;

  if(
    !confirm(
      name + " աշխատակցին հեռացնե՞լ"
    )
  ){
    return;
  }

  const result =
    await db
    .from("employees")
    .update({
      active:false
    })
    .eq("id",id);

  if(result.error){

    alert(
      "Աշխատակցին հեռացնել չհաջողվեց"
    );

    return;
  }

  selectedEmployeeId = null;

  await loadData();
}

async function changeSale(
  employeeId,
  field,
  value
){

  if(!passwordOK()){

    await loadData();
    return;
  }

  let count =
    Math.round(
      Number(value)
    );

  if(
    !Number.isFinite(count) ||
    count < 0
  ){
    count = 0;
  }

  const existing =
    getTodayRow(employeeId);

  try{

    if(existing){

      const update = {
        updated_at:
          new Date().toISOString()
      };

      update[field] = count;

      const result =
        await db
        .from("daily_sales")
        .update(update)
        .eq(
          "id",
          existing.id
        );

      if(result.error)
        throw result.error;

    }else{

      const row = {
        employee_id:employeeId,
        sale_date:currentDate,

        package_3900:0,
        package_4900:0,
        package_5900:0,

        package_6900:0,
        package_7900:0,
        package_8900:0,

        package_iptv1:0,
        package_iptv2:0,
        package_iptv3:0,

        updated_at:
          new Date().toISOString()
      };

      row[field] = count;

      const result =
        await db
        .from("daily_sales")
        .insert(row);

      if(result.error)
        throw result.error;
    }

    await loadData();

  }catch(error){

    console.error(error);

    alert(
      "Վաճառքը պահպանել չհաջողվեց"
    );

    await loadData();
  }
}

async function changeTotalBonus(
  packageId,
  name,
  currentValue
){

  if(!passwordOK()) return;

  const answer =
    prompt(
      name + "\nՆոր ընդհանուր բոնուսը",
      currentValue
    );

  if(answer === null) return;

  const total =
    Math.round(Number(answer));

  if(
    !Number.isFinite(total) ||
    total < 0
  ){
    alert("Սխալ թիվ");
    return;
  }

  const employee =
    Math.floor(total/2);

  const admin =
    total - employee;

  const result =
    await db
    .from("packages")
    .update({
      bonus:total,
      employee_bonus:employee,
      admin_bonus:admin,
      updated_at:
        new Date().toISOString()
    })
    .eq("id",packageId);

  if(result.error){

    alert(
      "Չհաջողվեց պահպանել"
    );

    return;
  }

  await loadData();
}

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeJS(text){

  return String(text)
    .replaceAll("\\","\\\\")
    .replaceAll("'","\\'");
}
