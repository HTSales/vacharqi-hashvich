<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:5px auto 15px;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

h1{
  margin:5px 0;
  font-size:28px;
}

.subtitle{
  color:#9aa8c8;
  font-size:14px;
}

.totalBox{
  background:linear-gradient(135deg,#142b4a,#0c739e);
  border-radius:22px;
  padding:18px;
  margin-bottom:20px;
}

.totalTitle{
  font-size:14px;
  opacity:.8;
}

.bigNumber{
  font-size:31px;
  font-weight:900;
  margin:5px 0 15px;
}

.totalGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.totalItem{
  background:rgba(0,0,0,.18);
  padding:12px;
  border-radius:13px;
}

.small{
  font-size:12px;
  opacity:.7;
}

.value{
  font-size:19px;
  font-weight:800;
  margin-top:4px;
}

.employee{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-bottom:16px;
}

.employeeTop{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.name{
  flex:1;
  padding:14px;
  border-radius:13px;
  border:1px solid #2a3a55;
  background:#0c1526;
  color:#fff;
  font-size:17px;
  font-weight:700;
}

.delete{
  border:0;
  background:#3a1d26;
  color:#ff9ba8;
  border-radius:12px;
  padding:13px;
  font-weight:700;
}

.package{
  display:grid;
  grid-template-columns:1fr 90px;
  align-items:center;
  gap:10px;
  background:#0c1526;
  border-radius:14px;
  padding:11px;
  margin-bottom:8px;
}

.packagePrice{
  font-weight:800;
  font-size:17px;
}

.packageBonus{
  color:#7f91ad;
  font-size:12px;
  margin-top:3px;
  cursor:pointer;
}

.count{
  width:100%;
  padding:11px 5px;
  border-radius:11px;
  border:1px solid #34435d;
  background:#172238;
  color:#fff;
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.employeeResult{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.resultItem{
  background:#172238;
  border-radius:13px;
  padding:12px;
}

.bonusResult{
  background:#12372f;
}

.bonusResult .value{
  color:#62e9b8;
}

.actionButton{
  width:100%;
  border:0;
  padding:16px;
  border-radius:15px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
}

.addEmployee{background:#25a8df}
.excelButton{background:#16794d}
.backupButton{background:#805ad5}
.restoreButton{background:#b7791f}
.saveMonth{background:#1fa76f}

.monthBox{
  background:#111c30;
  border-radius:22px;
  padding:18px;
  margin-top:10px;
  margin-bottom:30px;
}

.monthBox h2{
  margin-top:0;
  font-size:22px;
}

.monthItem{
  background:#0c1526;
  border-radius:14px;
  padding:14px;
  margin-bottom:12px;
}

.monthName{
  font-size:18px;
  font-weight:900;
  margin-bottom:9px;
}

.monthRow{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:6px 0;
  font-size:14px;
}

.monthButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

.monthExcel{
  border:0;
  padding:11px;
  border-radius:10px;
  background:#16794d;
  color:white;
  font-weight:800;
}

.monthDelete{
  border:0;
  padding:11px;
  border-radius:10px;
  background:#3a1d26;
  color:#ff9ba8;
  font-weight:800;
}

.empty{
  color:#8795b3;
  text-align:center;
  padding:10px;
}

.sectionTitle{
  margin:20px 0 10px;
  font-size:18px;
  font-weight:900;
}

.bonusSettings{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-bottom:18px;
}

.bonusRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0c1526;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
}

.bonusEditBtn{
  border:0;
  background:#24364f;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
  font-weight:800;
}

.hiddenInput{
  display:none;
}
</style>
</head>

<body>

<div class="container">

<img src="IMG_7968.png" class="logo">

<div class="header">
  <h1>Վաճառքի Հաշվիչ</h1>
  <div class="subtitle">
    Աշխատակիցների վաճառքներ և բոնուսներ
  </div>
</div>

<div class="totalBox">
  <div class="totalTitle">Ընդհանուր վաճառքների քանակ</div>
  <div class="bigNumber" id="allSalesCount">0</div>

  <div class="totalGrid">
    <div class="totalItem">
      <div class="small">Ընդհանուր շրջանառություն</div>
      <div class="value" id="allRevenue">0 դրամ</div>
    </div>

    <div class="totalItem">
      <div class="small">Ընդհանուր բոնուս</div>
      <div class="value" id="allBonus">0 դրամ</div>
    </div>
  </div>
</div>

<div class="sectionTitle">Բոնուսների կարգավորում</div>

<div class="bonusSettings" id="bonusSettings"></div>

<div id="employees"></div>

<button class="actionButton addEmployee" onclick="addEmployee()">
  + Ավելացնել աշխատակից
</button>

<button class="actionButton excelButton" onclick="downloadCurrentExcel()">
  📥 Ներբեռնել Excel
</button>

<button class="actionButton backupButton" onclick="downloadBackup()">
  💾 Backup պահել
</button>

<button class="actionButton restoreButton" onclick="chooseBackupFile()">
  📂 Backup վերականգնել
</button>

<input
  type="file"
  id="backupFile"
  class="hiddenInput"
  accept=".json,application/json"
  onchange="restoreBackup(event)"
>

<div class="monthBox">

  <h2>Ամսվա հաշվետվություն</h2>

  <button class="actionButton saveMonth" onclick="saveCurrentMonth()">
    Պահպանել այս ամսվա արդյունքը
  </button>

  <div id="monthHistory"></div>

</div>

</div>

<script>

const PASSWORD = "1234";

const defaultPackages = [
  {price:3900,bonus:1000},
  {price:4900,bonus:1200},
  {price:5900,bonus:2000},
  {price:6900,bonus:1500},
  {price:7900,bonus:3000},
  {price:8900,bonus:2500}
];

let packages = loadPackages();
let employeesData = loadEmployees();
let monthHistory = loadMonths();

let totals = {
  sales:0,
  revenue:0,
  bonus:0
};

function loadPackages(){
  try{
    const saved = JSON.parse(localStorage.getItem("packagesData"));

    if(Array.isArray(saved) && saved.length === 6){
      return saved;
    }
  }catch(e){}

  return JSON.parse(JSON.stringify(defaultPackages));
}

function loadEmployees(){
  try{
    const saved = JSON.parse(localStorage.getItem("employeesData"));

    if(Array.isArray(saved)){
      saved.forEach(emp=>{
        if(!Array.isArray(emp.sales)){
          emp.sales = [0,0,0,0,0,0];
        }

        while(emp.sales.length < 6){
          emp.sales.push(0);
        }

        emp.sales = emp.sales.slice(0,6);
      });

      return saved;
    }
  }catch(e){}

  return [];
}

function loadMonths(){
  try{
    const saved = JSON.parse(localStorage.getItem("monthHistory"));

    if(Array.isArray(saved)){
      return saved;
    }
  }catch(e){}

  return [];
}

function saveAll(){
  localStorage.setItem("packagesData", JSON.stringify(packages));
  localStorage.setItem("employeesData", JSON.stringify(employeesData));
  localStorage.setItem("monthHistory", JSON.stringify(monthHistory));
}

function askPassword(){
  const pass = prompt("Գրեք գաղտնաբառը");

  if(pass === null){
    return false;
  }

  if(pass !== PASSWORD){
    alert("Սխալ գաղտնաբառ");
    return false;
  }

  return true;
}

function money(number){
  return new Intl.NumberFormat("hy-AM").format(number) + " դրամ";
}

function escapeHtml(text){
  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function renderBonusSettings(){

  const container = document.getElementById("bonusSettings");

  container.innerHTML = "";

  packages.forEach((p,index)=>{

    const row = document.createElement("div");
    row.className = "bonusRow";

    row.innerHTML = `
      <div>
        <div class="packagePrice">${money(p.price)}</div>
        <div class="packageBonus">
          Բոնուս՝ ${money(p.bonus)}
        </div>
      </div>

      <button
        class="bonusEditBtn"
        onclick="changeBonus(${index})"
      >
        Փոխել
      </button>
    `;

    container.appendChild(row);
  });
}

function changeBonus(index){

  if(!askPassword()){
    return;
  }

  const currentBonus = packages[index].bonus;

  const newValue = prompt(
    money(packages[index].price) +
    " փաթեթի նոր բոնուսը",
    currentBonus
  );

  if(newValue === null){
    return;
  }

  const number = Number(newValue);

  if(!Number.isFinite(number) || number < 0){
    alert("Գրեք ճիշտ թիվ");
    return;
  }

  packages[index].bonus = Math.round(number);

  saveAll();

  renderBonusSettings();
  renderEmployees();
}

function addEmployee(){

  if(!askPassword()){
    return;
  }

  employeesData.push({
    name:"",
    sales:[0,0,0,0,0,0]
  });

  saveAll();
  renderEmployees();
}

function deleteEmployee(index){

  if(!askPassword()){
    return;
  }

  const name = employeesData[index].name || "այս աշխատակցին";

  if(!confirm("Վստա՞հ եք, որ ցանկանում եք ջնջել " + name + "։")){
    return;
  }

  employeesData.splice(index,1);

  saveAll();
  renderEmployees();
}

function changeEmployeeName(index){

  if(!askPassword()){
    return;
  }

  const oldName = employeesData[index].name || "";

  const newName = prompt(
    "Գրեք աշխատակցի անունը",
    oldName
  );

  if(newName === null){
    return;
  }

  employeesData[index].name = newName.trim();

  saveAll();
  renderEmployees();
}

function changeCount(employeeIndex,packageIndex){

  if(!askPassword()){
    return;
  }

  const current =
    Number(employeesData[employeeIndex].sales[packageIndex]) || 0;

  const value = prompt(
    money(packages[packageIndex].price) +
    " փաթեթի վաճառքների քանակը",
    current
  );

  if(value === null){
    return;
  }

  const number = Number(value);

  if(!Number.isFinite(number) || number < 0){
    alert("Գրեք ճիշտ թիվ");
    return;
  }

  employeesData[employeeIndex].sales[packageIndex] =
    Math.floor(number);

  saveAll();
  renderEmployees();
}

function renderEmployees(){

  const container = document.getElementById("employees");
  container.innerHTML = "";

  employeesData.forEach((employee,employeeIndex)=>{

    const box = document.createElement("div");
    box.className = "employee";

    let packageHTML = "";

    packages.forEach((p,packageIndex)=>{

      const count =
        Number(employee.sales[packageIndex]) || 0;

      packageHTML += `
        <div class="package">

          <div>
            <div class="packagePrice">
              ${money(p.price)}
            </div>

            <div class="packageBonus">
              Բոնուս՝ ${money(p.bonus)}
            </div>
          </div>

          <input
            class="count"
            type="number"
            value="${count}"
            readonly
            onclick="changeCount(${employeeIndex},${packageIndex})"
          >

        </div>
      `;
    });

    box.innerHTML = `
      <div class="employeeTop">

        <input
          class="name"
          type="text"
          value="${escapeHtml(employee.name)}"
          placeholder="Աշխատակցի անուն"
          readonly
          onclick="changeEmployeeName(${employeeIndex})"
        >

        <button
          class="delete"
          onclick="deleteEmployee(${employeeIndex})"
        >
          Ջնջել
        </button>

      </div>

      ${packageHTML}

      <div class="employeeResult">

        <div class="resultItem">
          <div class="small">
            Վաճառքների քանակ
          </div>

          <div
            class="value"
            id="employeeSales${employeeIndex}"
          >
            0
          </div>
        </div>

        <div class="resultItem bonusResult">
          <div class="small">
            Ստացած բոնուս
          </div>

          <div
            class="value"
            id="employeeBonus${employeeIndex}"
          >
            0 դրամ
          </div>
        </div>

      </div>
    `;

    container.appendChild(box);
  });

  calculate();
}

function calculate(){

  let allSalesCount = 0;
  let allRevenue = 0;
  let allBonus = 0;

  employeesData.forEach((employee,employeeIndex)=>{

    let employeeSales = 0;
    let employeeBonus = 0;

    employee.sales.forEach((count,packageIndex)=>{

      count = Number(count) || 0;

      employeeSales += count;

      employeeBonus +=
        count * packages[packageIndex].bonus;

      allSalesCount += count;

      allRevenue +=
        count * packages[packageIndex].price;

      allBonus +=
        count * packages[packageIndex].bonus;
    });

    const salesElement =
      document.getElementById("employeeSales" + employeeIndex);

    const bonusElement =
      document.getElementById("employeeBonus" + employeeIndex);

    if(salesElement){
      salesElement.textContent = employeeSales;
    }

    if(bonusElement){
      bonusElement.textContent = money(employeeBonus);
    }
  });

  totals.sales = allSalesCount;
  totals.revenue = allRevenue;
  totals.bonus = allBonus;

  document.getElementById("allSalesCount").textContent =
    allSalesCount;

  document.getElementById("allRevenue").textContent =
    money(allRevenue);

  document.getElementById("allBonus").textContent =
    money(allBonus);
}

function getMonthName(){

  const months = [
    "Հունվար",
    "Փետրվար",
    "Մարտ",
    "Ապրիլ",
    "Մայիս",
    "Հունիս",
    "Հուլիս",
    "Օգոստոս",
    "Սեպտեմբեր",
    "Հոկտեմբեր",
    "Նոյեմբեր",
    "Դեկտեմբեր"
  ];

  const date = new Date();

  return months[date.getMonth()] + " " + date.getFullYear();
}

function saveCurrentMonth(){

  if(!askPassword()){
    return;
  }

  calculate();

  const monthName = getMonthName();

  const snapshot = JSON.parse(JSON.stringify(employeesData));
  const packageSnapshot = JSON.parse(JSON.stringify(packages));

  const data = {
    month:monthName,
    sales:totals.sales,
    revenue:totals.revenue,
    bonus:totals.bonus,
    employees:snapshot,
    packages:packageSnapshot
  };

  const existingIndex =
    monthHistory.findIndex(item=>item.month === monthName);

  if(existingIndex >= 0){

    if(!confirm(monthName + " ամսվա հաշվետվությունն արդեն կա։ Թարմացնե՞լ։")){
      return;
    }

    monthHistory[existingIndex] = data;

  }else{
    monthHistory.unshift(data);
  }

  saveAll();
  renderMonthHistory();

  alert("Ամսվա արդյունքը պահպանված է");
}

function deleteMonth(index){

  if(!askPassword()){
    return;
  }

  if(!confirm(
    "Վստա՞հ եք, որ ցանկանում եք ջնջել " +
    monthHistory[index].month +
    " ամսվա հաշվետվությունը։"
  )){
    return;
  }

  monthHistory.splice(index,1);

  saveAll();
  renderMonthHistory();
}

function renderMonthHistory(){

  const box = document.getElementById("monthHistory");
  box.innerHTML = "";

  if(monthHistory.length === 0){

    box.innerHTML = `
      <div class="empty">
        Դեռ պահպանված ամիս չկա
      </div>
    `;

    return;
  }

  monthHistory.forEach((item,index)=>{

    const div = document.createElement("div");
    div.className = "monthItem";

    div.innerHTML = `
      <div class="monthName">
        ${escapeHtml(item.month)}
      </div>

      <div class="monthRow">
        <span>Վաճառքներ</span>
        <strong>${item.sales}</strong>
      </div>

      <div class="monthRow">
        <span>Շրջանառություն</span>
        <strong>${money(item.revenue)}</strong>
      </div>

      <div class="monthRow">
        <span>Բոնուսներ</span>
        <strong>${money(item.bonus)}</strong>
      </div>

      <div class="monthButtons">

        <button
          class="monthExcel"
          onclick="downloadMonthExcel(${index})"
        >
          Excel
        </button>

        <button
          class="monthDelete"
          onclick="deleteMonth(${index})"
        >
          Ջնջել
        </button>

      </div>
    `;

    box.appendChild(div);
  });
}

function downloadExcel(employees,usedPackages,title,filename){

  if(typeof XLSX === "undefined"){
    alert("Excel համակարգը չի բեռնվել");
    return;
  }

  let totalSales = 0;
  let totalRevenue = 0;
  let totalBonus = 0;

  let bestName = "Դեռ չկա";
  let bestSales = 0;
  let bestBonus = 0;

  const employeeRows = [];

  employees.forEach(employee=>{

    const sales =
      Array.isArray(employee.sales)
      ? employee.sales
      : [0,0,0,0,0,0];

    let employeeSales = 0;
    let employeeRevenue = 0;
    let employeeBonus = 0;

    for(let i=0;i<6;i++){

      const count = Number(sales[i]) || 0;

      employeeSales += count;
      employeeRevenue += count * usedPackages[i].price;
      employeeBonus += count * usedPackages[i].bonus;
    }

    totalSales += employeeSales;
    totalRevenue += employeeRevenue;
    totalBonus += employeeBonus;

    if(
      employeeSales > bestSales ||
      (
        employeeSales === bestSales &&
        employeeBonus > bestBonus
      )
    ){
      bestName = employee.name || "Անանուն աշխատակից";
      bestSales = employeeSales;
      bestBonus = employeeBonus;
    }

    employeeRows.push([
      employee.name || "Անանուն աշխատակից",
      Number(sales[0]) || 0,
      Number(sales[1]) || 0,
      Number(sales[2]) || 0,
      Number(sales[3]) || 0,
      Number(sales[4]) || 0,
      Number(sales[5]) || 0,
      employeeSales,
      employeeRevenue,
      employeeBonus
    ]);
  });

  const rows = [
    [title],
    [],
    ["🏆 ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ"],
    ["Անուն",bestName],
    ["Վաճառքների քանակ",bestSales],
    ["Ստացած բոնուս",bestBonus],
    [],
    [
      "Աշխատակից",
      "3900 փաթեթ",
      "4900 փաթեթ",
      "5900 փաթեթ",
      "6900 փաթեթ",
      "7900 փաթեթ",
      "8900 փաթեթ",
      "Ընդհանուր վաճառք",
      "Շրջանառություն",
      "Ստացած բոնուս"
    ]
  ];

  employeeRows.forEach(row=>rows.push(row));

  rows.push([
    "ԸՆԴՀԱՆՈՒՐ",
    "",
    "",
    "",
    "",
    "",
    "",
    totalSales,
    totalRevenue,
    totalBonus
  ]);

  const worksheet = XLSX.utils.aoa_to_sheet(rows);

  worksheet["!cols"] = [
    {wch:24},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:14},
    {wch:18},
    {wch:20},
    {wch:20}
  ];

  const workbook = XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    workbook,

  );

  XLSX.writeFile(

}

function downloadCurrentExcel(){

  calculate();

  downloadExcel(
    employeesData,
    packages,
    getMonthName() + " — ընթացիկ արդյունք",
    "Վաճառքներ_" + getMonthName()
  );
}

function downloadMonthExcel(index){

  const month = monthHistory[index];

  if(!month || !month.employees){
    alert("Այս ամսվա մանրամասն տվյալները պահպանված չեն");
    return;
  }

  const usedPackages =
    Array.isArray(month.packages)
    ? month.packages
    : packages;

  downloadExcel(
    month.employees,
    usedPackages,
    month.month + " — հաշվետվություն",
    "Վաճառքներ_" + month.month
  );
}

/* BACKUP */

function downloadBackup(){

  const backupData = {
    version:1,
    createdAt:new Date().toISOString(),
    packages:packages,
    employees:employeesData,
    months:monthHistory
  };

  const text = JSON.stringify(backupData,null,2);

  const blob = new Blob(
    [text],
    {type:"application/json"}
  );

  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");

  a.href = url;
  a.download =
    "vacharqi-backup-" +
    new Date().toISOString().slice(0,10) +
    ".json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}

function chooseBackupFile(){

  if(!askPassword()){
    return;
  }

  document.getElementById("backupFile").click();
}

function restoreBackup(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    try{

      const data = JSON.parse(reader.result);

      if(
        !data ||
        !Array.isArray(data.packages) ||
        !Array.isArray(data.employees) ||
        !Array.isArray(data.months)
      ){
        throw new Error();
      }

      if(!confirm(
        "Backup-ը վերականգնելու դեպքում ներկայիս տվյալները կփոխարինվեն։ Շարունակե՞լ։"
      )){
        event.target.value = "";
        return;
      }

      packages = data.packages;
      employeesData = data.employees;
      monthHistory = data.months;

      saveAll();

      renderBonusSettings();
      renderEmployees();
      renderMonthHistory();

      alert("Backup-ը հաջողությամբ վերականգնվեց");

    }catch(e){

      alert("Այս Backup ֆայլը ճիշտ չէ");

    }

    event.target.value = "";
  };

  reader.readAsText(file);
}

if(employeesData.length === 0){

  employeesData.push({
    name:"",
    sales:[0,0,0,0,0,0]
  });

  saveAll();
}

renderBonusSettings();
renderEmployees();
renderMonthHistory();

</script>
