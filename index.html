<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Վաճառքի Հաշվիչ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#08101d;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.logo{
  display:block;
  width:220px;
  max-width:70%;
  margin:5px auto 15px;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

h1{
  margin:5px 0;
  font-size:28px;
}

.subtitle{
  color:#9aa8c8;
  font-size:14px;
}

.today{
  margin-top:7px;
  color:#62e9b8;
  font-size:14px;
  font-weight:800;
}

.status{
  text-align:center;
  color:#62e9b8;
  font-size:12px;
  min-height:18px;
  margin-bottom:12px;
}

.totalBox{
  background:linear-gradient(135deg,#142b4a,#0c739e);

}

.totalTitle{

}

.bigNumber{

}

.totalGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.totalItem{
  background:rgba(0,0,0,.18);
  padding:12px;
  border-radius:13px;
}

.small{
  font-size:12px;

}

.value{
  font-size:19px;
  font-weight:800;
  margin-top:4px;
}

.bestBox{
  background:linear-gradient(135deg,#33270c,#1a2334);
  border:1px solid #8f6a17;
  border-radius:18px;
  padding:15px;
  margin-bottom:20px;

}

.bestIcon{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#4a3810;
  display:flex;
  align-items:center;
  justify-content:center;

}

.bestLabel{
  color:#ffd25a;
  font-size:12px;
  font-weight:900;
}

.bestName{
  font-size:20px;
  font-weight:900;
  margin-top:3px;
}

.bestInfo{
  color:#c8bfa8;
  font-size:13px;
  margin-top:5px;
}

.sectionTitle{
  margin:20px 0 10px;
  font-size:18px;
  font-weight:900;
}

.bonusSettings{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-bottom:18px;
}

.bonusRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#0c1526;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
}

.packagePrice{
  font-weight:800;
  font-size:17px;
}

.packageBonus{
  color:#7f91ad;
  font-size:12px;
  margin-top:3px;
}

.editBtn{
  border:0;
  background:#24364f;
  color:#fff;
  padding:9px 12px;
  border-radius:10px;
  font-weight:800;
}

.employee{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-bottom:16px;
}

.employeeTop{
  display:flex;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}

.name{
  flex:1;
  padding:14px;
  border-radius:13px;
  border:1px solid #2a3a55;
  background:#0c1526;
  color:#fff;
  font-size:17px;
  font-weight:700;
}

.delete{
  border:0;
  background:#3a1d26;
  color:#ff9ba8;
  border-radius:12px;
  padding:13px;
  font-weight:700;
}

.package{
  display:grid;
  grid-template-columns:1fr 90px;
  align-items:center;
  gap:10px;
  background:#0c1526;
  border-radius:14px;
  padding:11px;
  margin-bottom:8px;
}

.count{
  width:100%;
  padding:11px 5px;
  border-radius:11px;
  border:1px solid #34435d;
  background:#172238;
  color:#fff;
  text-align:center;
  font-size:18px;
  font-weight:800;
}

.employeeResult{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:13px;
}

.resultItem{
  background:#172238;
  border-radius:13px;
  padding:12px;
}

.bonusResult{
  background:#12372f;
}

.bonusResult .value{
  color:#62e9b8;
}

.button{
  width:100%;
  border:0;
  padding:16px;
  border-radius:15px;
  color:#fff;
  font-size:16px;
  font-weight:900;
  margin-bottom:12px;
}

.add{background:#25a8df}
.excel{background:#16794d}
.refresh{background:#24364f}

.historyBox{
  background:#111c30;
  border-radius:22px;
  padding:16px;
  margin-top:20px;
  margin-bottom:30px;
}

.dayItem{
  background:#0c1526;
  border-radius:14px;
  padding:13px;
  margin-bottom:9px;
}

.dayDate{
  font-size:16px;
  font-weight:900;
}

.dayInfo{
  color:#9aa8c8;
  font-size:13px;
  margin-top:6px;
}

.dayExcel{
  width:100%;
  border:0;
  border-radius:10px;
  padding:10px;
  margin-top:9px;
  background:#16794d;
  color:#fff;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#8795b3;
  padding:15px;
}
</style>
</head>

<body>

<div class="container">

<img src="IMG_7968.png" class="logo">

<div class="header">
  <h1>Վաճառքի Հաշվիչ</h1>
  <div class="subtitle">Այսօրվա վաճառքներ և բոնուսներ</div>
  <div class="today" id="todayText"></div>
</div>

<div id="status" class="status"></div>

<div class="totalBox">

  <div class="totalTitle">
    Այսօրվա վաճառքների քանակ
  </div>

  <div class="bigNumber" id="allSales">
    0
  </div>

  <div class="totalGrid">

    <div class="totalItem">
      <div class="small">Այսօրվա շրջանառություն</div>
      <div class="value" id="allRevenue">0 դրամ</div>
    </div>

    <div class="totalItem">
      <div class="small">Այսօրվա բոնուս</div>
      <div class="value" id="allBonus">0 դրամ</div>
    </div>

  </div>

</div>

<div class="bestBox">

  <div class="bestIcon">🏆</div>

  <div>
    <div class="bestLabel">ԱՅՍՕՐՎԱ ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ</div>
    <div class="bestName" id="bestName">Դեռ չկա</div>
    <div class="bestInfo" id="bestInfo">0 վաճառք • 0 դրամ</div>
  </div>

</div>

<div class="sectionTitle">
  Բոնուսների կարգավորում
</div>

<div class="bonusSettings" id="bonusSettings"></div>

<div class="sectionTitle">
  Աշխատակիցներ
</div>

<div id="employees"></div>

<button class="button add" onclick="addEmployee()">
  + Ավելացնել աշխատակից
</button>

<button class="button excel" onclick="downloadTodayExcel()">
  📥 Այսօրվա Excel
</button>

<button class="button refresh" onclick="loadEverything()">
  🔄 Թարմացնել
</button>

<div class="historyBox">

  <div class="sectionTitle" style="margin-top:0">
    Նախորդ օրերի արդյունքներ
  </div>

  <div id="history"></div>

</div>

</div>

<script>

const PASSWORD="1234";

const SUPABASE_URL=
"https://pstoegdsngmkxggyaloz.supabase.co";

const SUPABASE_KEY=
"sb_publishable_PScArCHEI_Oq8XToX6F-EA_ep-BF19a";

const db=supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const fields=[
  "package_3900",
  "package_4900",
  "package_5900",
  "package_6900",
  "package_7900",
  "package_8900"
];

let employees=[];
let packages=[];
let todayRows={};
let currentDay="";

function money(n){
  return new Intl.NumberFormat("hy-AM")
    .format(Number(n)||0)+" դրամ";
}

function askPassword(){

  const p=prompt("Գրեք գաղտնաբառը");

  if(p===null) return false;

  if(p!==PASSWORD){
    alert("Սխալ գաղտնաբառ");
    return false;
  }

  return true;
}

function localDateKey(){

  const d=new Date();

  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");

  return `${y}-${m}-${day}`;
}

function prettyDate(dateString){

  const months=[
    "Հունվար","Փետրվար","Մարտ","Ապրիլ",
    "Մայիս","Հունիս","Հուլիս","Օգոստոս",
    "Սեպտեմբեր","Հոկտեմբեր","Նոյեմբեր","Դեկտեմբեր"
  ];

  const parts=dateString.split("-");

  return `${Number(parts[2])} ${months[Number(parts[1])-1]} ${parts[0]}`;
}

function status(text,error=false){

  const el=document.getElementById("status");

  el.textContent=text;
  el.style.color=error ? "#ff8b9b" : "#62e9b8";
}

function escapeHtml(text){

  return String(text||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function loadEverything(){

  currentDay=localDateKey();

  document.getElementById("todayText").textContent=
    "Այսօրվա արդյունք — "+prettyDate(currentDay);

  status("Բեռնում է...");

  try{

    const [
      employeesRes,
      packagesRes,
      salesRes
    ]=await Promise.all([

      db
        .from("employees")
        .select("*")
        .eq("active",true)
        .order("id"),

      db
        .from("packages")
        .select("*")
        .order("price"),

      db
        .from("daily_sales")
        .select("*")
        .eq("sale_date",currentDay)

    ]);

    if(employeesRes.error) throw employeesRes.error;
    if(packagesRes.error) throw packagesRes.error;
    if(salesRes.error) throw salesRes.error;

    employees=employeesRes.data||[];
    packages=packagesRes.data||[];

    todayRows={};

    (salesRes.data||[]).forEach(row=>{
      todayRows[row.employee_id]=row;
    });

    renderBonuses();
    renderEmployees();
    loadHistory();

    status("● Այսօրվա տվյալները թարմացված են");

  }catch(error){

    console.error(error);

    status("Չհաջողվեց բեռնել տվյալները",true);
  }
}

function renderBonuses(){

  const box=document.getElementById("bonusSettings");

  box.innerHTML="";

  packages.forEach((p,i)=>{

    const div=document.createElement("div");

    div.className="bonusRow";

    div.innerHTML=`
      <div>
        <div class="packagePrice">
          ${money(p.price)}
        </div>

        <div class="packageBonus">
          1 վաճառքից՝ ${money(p.bonus)}
        </div>
      </div>

      <button class="editBtn" onclick="changeBonus(${i})">
        Փոխել
      </button>
    `;

    box.appendChild(div);
  });
}

async function changeBonus(i){

  if(!askPassword()) return;

  const value=prompt(
    "Նոր բոնուսը",
    packages[i].bonus
  );

  if(value===null) return;

  const n=Number(value);

  if(!Number.isFinite(n)||n<0){
    alert("Գրեք ճիշտ թիվ");
    return;
  }

  const {error}=await db
    .from("packages")
    .update({
      bonus:Math.round(n),
      updated_at:new Date().toISOString()
    })
    .eq("id",packages[i].id);

  if(error){
    alert("Բոնուսը չպահպանվեց");
    return;
  }

  packages[i].bonus=Math.round(n);

  renderBonuses();
  renderEmployees();
}

function emptyRow(employeeId){

  return{
    employee_id:employeeId,
    sale_date:currentDay,
    package_3900:0,
    package_4900:0,
    package_5900:0,
    package_6900:0,
    package_7900:0,
    package_8900:0
  };
}

function employeeRow(employeeId){

  return todayRows[employeeId] || emptyRow(employeeId);
}

async function addEmployee(){

  if(!askPassword()) return;

  const name=prompt("Գրեք աշխատակցի անունը");

  if(!name || !name.trim()) return;

  const {data,error}=await db
    .from("employees")
    .insert({
      name:name.trim(),
      active:true,
      updated_at:new Date().toISOString()
    })
    .select()
    .single();

  if(error){
    alert("Չհաջողվեց ավելացնել։ Հնարավոր է նույն անունն արդեն կա։");
    return;
  }

  employees.push(data);

  renderEmployees();
}

async function changeName(i){

  if(!askPassword()) return;

  const employee=employees[i];

  const name=prompt(
    "Աշխատակցի նոր անունը",
    employee.name
  );

  if(!name || !name.trim()) return;

  const {error}=await db
    .from("employees")
    .update({
      name:name.trim(),
      updated_at:new Date().toISOString()
    })
    .eq("id",employee.id);

  if(error){
    alert("Անունը չպահպանվեց");
    return;
  }

  employee.name=name.trim();

  renderEmployees();
}

async function deleteEmployee(i){

  if(!askPassword()) return;

  const employee=employees[i];

  if(!confirm(
    "Հեռացնե՞լ "+employee.name+" աշխատակիցների ցուցակից։ Նրա հին արդյունքները չեն ջնջվի։"
  )){
    return;
  }

  const {error}=await db
    .from("employees")
    .update({
      active:false,
      updated_at:new Date().toISOString()
    })
    .eq("id",employee.id);

  if(error){
    alert("Չհաջողվեց հեռացնել");
    return;
  }

  employees.splice(i,1);

  renderEmployees();
}

async function changeCount(employeeIndex,packageIndex){

  if(!askPassword()) return;

  const employee=employees[employeeIndex];
  const row=employeeRow(employee.id);
  const field=fields[packageIndex];

  const value=prompt(
    money(packages[packageIndex].price)+" փաթեթի այսօրվա վաճառքների քանակը",
    Number(row[field])||0
  );

  if(value===null) return;

  const n=Number(value);

  if(!Number.isInteger(n)||n<0){
    alert("Գրեք ճիշտ ամբողջ թիվ");
    return;
  }

  const payload={
    employee_id:employee.id,
    sale_date:currentDay,
    package_3900:Number(row.package_3900)||0,
    package_4900:Number(row.package_4900)||0,
    package_5900:Number(row.package_5900)||0,
    package_6900:Number(row.package_6900)||0,
    package_7900:Number(row.package_7900)||0,
    package_8900:Number(row.package_8900)||0,
    updated_at:new Date().toISOString()
  };

  payload[field]=n;

  const {data,error}=await db
    .from("daily_sales")
    .upsert(
      payload,
      {onConflict:"employee_id,sale_date"}
    )
    .select()
    .single();

  if(error){

    console.error(error);

    alert("Վաճառքը չպահպանվեց");
    return;
  }

  todayRows[employee.id]=data;

  renderEmployees();
  loadHistory();
}

function renderEmployees(){

  const box=document.getElementById("employees");

  box.innerHTML="";

  if(employees.length===0){

    box.innerHTML=`
      <div class="empty">
        Դեռ աշխատակից չկա
      </div>
    `;

    calculate();
    return;
  }

  employees.forEach((employee,ei)=>{

    const row=employeeRow(employee.id);

    let packagesHtml="";

    packages.forEach((p,pi)=>{

      const count=Number(row[fields[pi]])||0;

      packagesHtml+=`
        <div class="package">

          <div>
            <div class="packagePrice">
              ${money(p.price)}
            </div>

            <div class="packageBonus">
              Բոնուս՝ ${money(p.bonus)}
            </div>
          </div>

          <input
            class="count"
            readonly
            value="${count}"
            onclick="changeCount(${ei},${pi})"
          >

        </div>
      `;
    });

    const div=document.createElement("div");

    div.className="employee";

    div.innerHTML=`
      <div class="employeeTop">

        <input
          class="name"
          readonly
          value="${escapeHtml(employee.name)}"
          onclick="changeName(${ei})"
        >

        <button
          class="delete"
          onclick="deleteEmployee(${ei})"
        >
          Ջնջել
        </button>

      </div>

      ${packagesHtml}

      <div class="employeeResult">

        <div class="resultItem">
          <div class="small">
            Այսօրվա վաճառք
          </div>

          <div class="value" id="sales${ei}">
            0
          </div>
        </div>

        <div class="resultItem bonusResult">
          <div class="small">
            Այսօրվա բոնուս
          </div>

          <div class="value" id="bonus${ei}">
            0 դրամ
          </div>
        </div>

      </div>
    `;

    box.appendChild(div);
  });

  calculate();
}

function calculate(){

  let allSales=0;
  let allRevenue=0;
  let allBonus=0;

  let best=null;

  employees.forEach((employee,ei)=>{

    const row=employeeRow(employee.id);

    let sales=0;
    let bonus=0;

    packages.forEach((p,pi)=>{

      const count=Number(row[fields[pi]])||0;

      sales+=count;
      bonus+=count*Number(p.bonus);

      allSales+=count;
      allRevenue+=count*Number(p.price);
      allBonus+=count*Number(p.bonus);
    });

    const salesEl=document.getElementById("sales"+ei);
    const bonusEl=document.getElementById("bonus"+ei);

    if(salesEl) salesEl.textContent=sales;
    if(bonusEl) bonusEl.textContent=money(bonus);

    if(
      !best ||
      sales>best.sales ||
      (sales===best.sales && bonus>best.bonus)
    ){
      best={
        name:employee.name,
        sales,
        bonus
      };
    }
  });

  document.getElementById("allSales").textContent=allSales;
  document.getElementById("allRevenue").textContent=money(allRevenue);
  document.getElementById("allBonus").textContent=money(allBonus);

  if(best && best.sales>0){

    document.getElementById("bestName").textContent=best.name;

    document.getElementById("bestInfo").textContent=
      best.sales+" վաճառք • "+money(best.bonus);

  }else{

    document.getElementById("bestName").textContent="Դեռ չկա";

    document.getElementById("bestInfo").textContent=
      "0 վաճառք • 0 դրամ";
  }

  return{
    sales:allSales,
    revenue:allRevenue,
    bonus:allBonus
  };
}

async function loadHistory(){

  const {data,error}=await db
    .from("daily_sales")
    .select("*")
    .order("sale_date",{ascending:false});

  if(error) return;

  const grouped={};

  (data||[]).forEach(row=>{

    if(!grouped[row.sale_date]){
      grouped[row.sale_date]=[];
    }

    grouped[row.sale_date].push(row);
  });

  const box=document.getElementById("history");

  box.innerHTML="";

  const dates=Object.keys(grouped);

  if(dates.length===0){

    box.innerHTML=`
      <div class="empty">
        Դեռ պատմություն չկա
      </div>
    `;

    return;
  }

  dates.slice(0,31).forEach(date=>{

    let sales=0;
    let revenue=0;
    let bonus=0;

    grouped[date].forEach(row=>{

      packages.forEach((p,pi)=>{

        const count=Number(row[fields[pi]])||0;

        sales+=count;
        revenue+=count*Number(p.price);
        bonus+=count*Number(p.bonus);
      });
    });

    const div=document.createElement("div");

    div.className="dayItem";

    div.innerHTML=`
      <div class="dayDate">
        ${prettyDate(date)}
      </div>

      <div class="dayInfo">
        ${sales} վաճառք • ${money(revenue)} • ${money(bonus)} բոնուս
      </div>

      <button
        class="dayExcel"
        onclick="downloadDayExcel('${date}')"
      >
        Excel
      </button>
    `;

    box.appendChild(div);
  });
}

function createExcelRows(date,rows){

  const output=[];

  output.push([
    "Օր",
    prettyDate(date)
  ]);

  output.push([]);

  output.push([
    "Աշխատակից",
    "3900",
    "4900",
    "5900",
    "6900",
    "7900",
    "8900",
    "Ընդհանուր վաճառք",
    "Շրջանառություն",
    "Բոնուս"
  ]);

  let bestName="Դեռ չկա";
  let bestSales=0;
  let bestBonus=0;

  employees.forEach(employee=>{

    const row=
      rows.find(x=>x.employee_id===employee.id) ||
      emptyRow(employee.id);

    let sales=0;
    let revenue=0;
    let bonus=0;

    const counts=[];

    packages.forEach((p,pi)=>{

      const count=Number(row[fields[pi]])||0;

      counts.push(count);

      sales+=count;
      revenue+=count*Number(p.price);
      bonus+=count*Number(p.bonus);
    });

    if(
      sales>bestSales ||
      (sales===bestSales && bonus>bestBonus)
    ){
      bestName=employee.name;
      bestSales=sales;
      bestBonus=bonus;
    }

    output.push([
      employee.name,
      ...counts,
      sales,
      revenue,
      bonus
    ]);
  });

  output.unshift(
    ["🏆 ԼԱՎԱԳՈՒՅՆ ԱՇԽԱՏԱԿԻՑ",bestName],
    ["Վաճառքներ",bestSales],
    ["Բոնուս",bestBonus],
    []
  );

  return output;
}

function downloadTodayExcel(){

  const rows=Object.values(todayRows);

  const data=createExcelRows(
    currentDay,
    rows
  );

  exportExcel(
    data,
    "Վաճառքներ_"+currentDay
  );
}

async function downloadDayExcel(date){

  const {data,error}=await db
    .from("daily_sales")
    .select("*")
    .eq("sale_date",date);

  if(error){
    alert("Չհաջողվեց բեռնել օրը");
    return;
  }

  const rows=createExcelRows(
    date,
    data||[]
  );

  exportExcel(
    rows,
    "Վաճառքներ_"+date
  );
}

function exportExcel(rows,fileName){

  const ws=XLSX.utils.aoa_to_sheet(rows);

  ws["!cols"]=[
    {wch:24},
    {wch:12},{wch:12},{wch:12},
    {wch:12},{wch:12},{wch:12},
    {wch:18},{wch:20},{wch:18}
  ];

  const wb=XLSX.utils.book_new();

  XLSX.utils.book_append_sheet(
    wb,
    ws,
    "Վաճառքներ"
  );

  XLSX.writeFile(
    wb,
    fileName+".xlsx"
  );
}
